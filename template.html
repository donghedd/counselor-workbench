<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>辅导员多工作域工作台</title>
<style>
:root{
  --bg:#f4f6fa;--card:#ffffff;--line:#e6eaf1;--txt:#1e2635;--sub:#6d788b;
  --green:#0f7a52;--green-bg:#e9f6ef;--yellow:#946200;--yellow-bg:#fdf4e0;
  --red:#c0363f;--red-bg:#fdeced;--gray:#6d788b;--gray-bg:#eff2f7;
  --blue:#2a5bd7;--blue-bg:#edf1fd;
  --sh1:0 1px 2px rgba(20,30,50,.04),0 1px 3px rgba(20,30,50,.06);
  --sh2:0 6px 18px rgba(20,30,50,.08);
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--txt);font-size:14px;line-height:1.5;display:flex;align-items:stretch;min-height:100vh;-webkit-font-smoothing:antialiased}
::selection{background:rgba(42,91,215,.16)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#cfd6e2;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b7c0cf;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid rgba(42,91,215,.45);outline-offset:2px}
/* ---------- 左侧导航 ---------- */
.sidebar{flex:0 0 228px;width:228px;background:#fff;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;z-index:55}
.brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid #eef1f6}
.brand .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,#3d70ee,#234ec4);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex:0 0 auto;letter-spacing:1px;box-shadow:0 3px 9px rgba(35,78,196,.24),inset 0 1px 0 rgba(255,255,255,.22)}
.brand .bt{min-width:0}
.brand b{display:block;font-size:14.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.brand .bt span{display:block;margin-top:3px;font-size:10.5px;color:#96a1b3;line-height:1.5;letter-spacing:.1px}
.nav-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:2px 10px 6px}
.nav-scroll::-webkit-scrollbar{width:6px}
.nav-lb{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:600;color:#a9b3c2;letter-spacing:.14em;padding:16px 8px 7px}
.nav-lb::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#e8edf5,rgba(232,237,245,0))}
.sidebar nav{display:flex;flex-direction:column;gap:2px;padding:0;background:none;border:0;position:static;flex:none;overflow:visible}
.sidebar .tab{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:13.5px;color:#5c6778;cursor:pointer;white-space:nowrap;user-select:none;transition:background .16s,color .16s}
.sidebar .tab svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.7;transition:opacity .16s}
.sidebar .tab:hover{background:#f4f7fc;color:#1d2735}
.sidebar .tab:hover svg{opacity:1}
.sidebar .tab.active{background:linear-gradient(90deg,rgba(42,91,215,.11),rgba(42,91,215,.05));color:#22499f;font-weight:600}
.sidebar .tab.active svg{opacity:1}
.sidebar .tab.active::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:17px;border-radius:0 3px 3px 0;background:var(--blue)}
.badge{margin-left:auto;font-size:11px;font-weight:500;color:#8b96a8;background:#f1f4f9;border-radius:20px;padding:1px 7px;font-variant-numeric:tabular-nums;transition:background .16s,color .16s}
.sidebar .tab.active .badge{background:rgba(42,91,215,.13);color:#22499f}
.side-foot{margin:8px 12px 14px;padding:11px 12px;border:1px solid #eef1f6;border-radius:10px;background:#fafbfd}
.side-foot .sf-t{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:#5c6778}
.side-foot .sf-dot{width:6px;height:6px;border-radius:50%;background:#22a06b;box-shadow:0 0 0 3px rgba(34,160,107,.12)}
.side-foot .sf-dot.ro{background:#9aa5b6;box-shadow:0 0 0 3px rgba(154,165,182,.14)}
.side-foot .sf-txt{margin-top:5px;font-size:10.5px;color:#9aa5b6;line-height:1.75}
/* ---------- 主区域 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
header{background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(8px);border-bottom:1px solid var(--line);padding:0 26px;height:54px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
#gen-at{color:#9aa5b6;font-size:11.5px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#gsearch{padding:7px 12px;border:1px solid var(--line);border-radius:8px;width:224px;outline:none;font-size:13px;background:#f7f9fc;transition:border-color .15s,box-shadow .15s,background .15s}
#gsearch::placeholder{color:#a3adbd}
#gsearch:focus{background:#fff;border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,91,215,.12)}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:13px;color:var(--txt);transition:background .15s,border-color .15s,color .15s}
.btn:hover{background:#f5f7fb;border-color:#c9d2e0}
.btn:active{background:#eef1f7}
main{padding:22px 26px;max-width:1440px;width:100%;margin:0 auto}
@media(max-width:820px){
  body{display:block}
  .sidebar{width:auto;height:auto;position:static;border-right:0;border-bottom:1px solid var(--line)}
  .brand{padding:12px 14px 10px;border-bottom:0}
  .nav-scroll{overflow:visible;padding:0 10px 10px}
  .nav-lb{display:none}
  .sidebar nav{flex-direction:row;gap:6px;overflow-x:auto;padding-bottom:2px}
  .sidebar .tab{padding:7px 11px;border-radius:8px}
  .sidebar .tab svg{width:15px;height:15px}
  .sidebar .tab.active::before{display:none}
  .badge{display:none}
  .side-foot{display:none}
  header{padding:8px 14px;height:auto;flex-wrap:wrap}
  #gen-at{order:3;flex:0 0 100%}
  main{padding:14px}
}
.page{display:none}.page.active{display:block}
/* ---------- 指标卡 ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--sh1);transition:box-shadow .18s,transform .18s,border-color .18s}
.card:hover{box-shadow:var(--sh2);transform:translateY(-1px);border-color:#dbe2ec}
.card .num{font-size:27px;font-weight:700;letter-spacing:-.6px;font-variant-numeric:tabular-nums;line-height:1.15}
.card .lbl{color:var(--sub);font-size:12px;margin-top:6px}
.card.g .num{color:var(--green)}.card.y .num{color:var(--yellow)}.card.r .num{color:var(--red)}.card.b .num{color:var(--blue)}
.card.kpi-link{cursor:pointer}
.card.kpi-link:hover{border-color:var(--blue);box-shadow:var(--sh2);transform:translateY(-1px)}
.card.kpi-link:hover .lbl{color:var(--blue)}
/* ---------- 批量导入 / 导出表格 ---------- */
.hd-acts{display:flex;gap:8px;flex:none}
.hd-acts .btn{white-space:nowrap}
@media(max-width:1240px){#gen-at{display:none}}
.drop{margin-top:6px;border:1.5px dashed #d7dfec;border-radius:12px;background:#fafcff;padding:26px 18px;text-align:center;transition:border-color .15s,background .15s}
.drop.on{border-color:var(--blue);background:rgba(42,91,215,.05)}
.drop .dz-t{font-size:13px;color:var(--txt)}
.drop .dz-s{margin-top:10px;font-size:11.5px;color:#9aa5b6}
.btn.danger{color:var(--red);border-color:#f3d4d4}
.btn.danger:hover{background:var(--red-bg);border-color:var(--red)}
.kv-form{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}
.kv-form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--sub)}
.kv-form label b{color:var(--txt);font-weight:600}
.kv-form input,.kv-form select{padding:6px 9px;border:1px solid var(--line);border-radius:7px;font-size:13px;outline:none;background:#fff}
.kv-form input:focus,.kv-form select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,91,215,.12)}
@media(max-width:640px){.kv-form{grid-template-columns:1fr}}
.xls-sec{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:13px;flex-wrap:wrap}
.xls-sec .sp{margin-left:auto;display:flex;gap:6px}
.xls-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.xls-g{border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fbfcfe}
.xls-g .gt{font-size:12px;color:var(--sub);font-weight:600;margin-bottom:6px;letter-spacing:.2px}
.xls-g .gt .gt-sub{font-weight:400;color:#a9b3c2;margin-left:8px;font-size:11px}
.xls-g label{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;margin:2px 10px 2px 0;cursor:pointer;white-space:nowrap}
.xls-g input,.xls-opts input{accent-color:var(--blue)}
.xls-opts{margin:14px 0;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.xls-opts label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.xls-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:4px}
.xls-row .btn.primary,.drop .btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
.xls-row .btn.primary:hover,.drop .btn.primary:hover{background:#2450c4;border-color:#2450c4}
@media(max-width:900px){.xls-grid{grid-template-columns:1fr}}
/* ---------- 区块与面板 ---------- */
h2.sec{font-size:15px;font-weight:600;margin:26px 0 12px;padding-left:10px;border-left:3px solid var(--blue);line-height:1.2}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:18px;overflow:auto;box-shadow:var(--sh1)}
.panel>b{display:block;font-size:13.5px;font-weight:600;margin-bottom:10px}
/* ---------- 表格 ---------- */
table{border-collapse:collapse;width:100%;font-size:13px}
th{background:#fafbfd;color:var(--sub);text-align:left;padding:9px 12px;font-size:12px;font-weight:600;letter-spacing:.2px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0;z-index:1}
td{padding:8px 12px;border-bottom:1px solid #eef1f6;white-space:nowrap;color:var(--txt)}
/* 固定列宽 + 自动换行：内容再长也不会撑宽整张表 */
table.tbl-fixed{table-layout:fixed}
table.tbl-fixed th,table.tbl-fixed td{white-space:normal;word-break:break-word;overflow-wrap:anywhere;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#f8fafd}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--blue)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:12px;font-weight:500;line-height:1.5}
.tg{background:var(--green-bg);color:var(--green)}.ty{background:var(--yellow-bg);color:var(--yellow)}
.tr{background:var(--red-bg);color:var(--red)}.tgr{background:var(--gray-bg);color:var(--gray)}
.tb{background:var(--blue-bg);color:var(--blue)}
/* ---------- 筛选 ---------- */
.filters{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.filters select,.filters input{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt);font-size:13px;outline:none;transition:border-color .15s,box-shadow .15s}
.filters select:focus,.filters input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,91,215,.12)}
.empty{color:var(--sub);background:#fafbfd;border:1px dashed #d9dfe9;border-radius:10px;padding:16px;text-align:center}
/* ---------- 警示类型多选按钮 ---------- */
.ac-seg{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.ac-seg-i{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--sub);font-size:13px;cursor:pointer;transition:background .15s,border-color .15s,color .15s;line-height:1.4}
.ac-seg-i:hover{border-color:#c3cfe3;color:var(--txt)}
.ac-seg-i .n{font-size:12px;font-weight:600;padding:0 6px;border-radius:999px;background:var(--gray-bg);color:var(--gray)}
.ac-seg-i.on{color:#fff;border-color:transparent;box-shadow:0 1px 4px rgba(15,25,50,.14)}
.ac-seg-i.on .n{background:rgba(255,255,255,.26);color:#fff}
.ac-seg-i[data-type="学业警示"].on{background:#c8871a}
.ac-seg-i[data-type="留级警示"].on{background:#d2642b}
.ac-seg-i[data-type="退学警示"].on{background:#bd3b2f}
/* ---------- 分页 ---------- */
.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 2px 4px;border-top:1px solid var(--line);margin-top:6px}
.pager .btn{padding:4px 10px;font-size:12px}
.pager .btn[disabled]{opacity:.45;cursor:not-allowed}
.pager select{padding:4px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--txt);font-size:12px}
/* ---------- 毕业班容器 ---------- */
.grad-wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.gview{min-width:0}
.empty-note{color:var(--sub);background:#fafbfd;border:1px dashed #d9dfe9;border-radius:var(--r);padding:20px;line-height:1.7}
.empty-note b{color:var(--txt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:900px){.grid2{grid-template-columns:1fr}}
.chip-legend span{margin-right:16px;font-size:12px;color:var(--sub)}
/* ---------- 弹窗 ---------- */
.modal-mask{display:none;position:fixed;inset:0;background:rgba(20,28,42,.42);backdrop-filter:blur(2px);z-index:100;overflow:auto}
.modal{background:var(--card);max-width:800px;margin:52px auto;border-radius:14px;padding:24px 28px;box-shadow:0 24px 60px rgba(16,24,40,.24)}
.modal h3{font-size:16px;margin-bottom:10px;padding-right:26px}
.modal .close{float:right;cursor:pointer;color:#9aa5b6;font-size:16px;line-height:1;padding:4px 8px;border-radius:8px}
.modal .close:hover{background:#f2f4f8;color:var(--txt)}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;font-size:13px;margin:12px 0}
.kv .k{color:var(--sub)}
/* ---------- 简易图表 ---------- */
.bar-row{display:flex;align-items:center;gap:10px;margin:8px 0}
.bar-label{width:170px;text-align:right;color:var(--sub);font-size:12px;flex-shrink:0}
.bar-track{flex:1;background:var(--gray-bg);border-radius:6px;height:16px;position:relative;overflow:hidden}
.bar-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,#4a76e8,#2a5bd7);min-width:3px}
.bar-num{width:44px;font-size:12px;color:var(--sub);font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.donut-legend div{font-size:13px;margin:4px 0}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.small{color:var(--sub);font-size:12px}
/* ---------- 环形图（多色 + 悬浮提示） ---------- */
.grid2>.span2{grid-column:1/-1}
.donut-svg{flex:0 0 auto;overflow:visible}
.donut-svg .seg{cursor:pointer;transition:stroke-width .12s ease,opacity .12s ease}
.donut-svg:hover .seg{opacity:.45}
.donut-svg .seg:hover{opacity:1;stroke-width:7.6}
.donut-c{font-size:7.4px;font-weight:600;fill:var(--txt);text-anchor:middle;dominant-baseline:middle;font-variant-numeric:tabular-nums}
.donut-cl{font-size:2.5px;fill:var(--sub);text-anchor:middle;dominant-baseline:middle}
.donut-legend{flex:1;min-width:170px}
.donut-legend div{font-size:12.5px;margin:6px 0;display:flex;align-items:center;gap:7px;white-space:nowrap}
.donut-legend .dot{flex:0 0 auto;margin:0;width:9px;height:9px;border-radius:3px}
.donut-legend .nm{color:var(--txt)}
.donut-legend .dv{margin-left:auto;color:var(--sub);font-variant-numeric:tabular-nums}
.donut-legend .dp{width:48px;text-align:right;color:var(--sub);font-variant-numeric:tabular-nums}
#dtip{position:fixed;z-index:9999;left:0;top:0;pointer-events:none;opacity:0;transition:opacity .1s;background:#1e2635;color:#fff;font-size:12px;line-height:1.5;padding:6px 10px;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.2);white-space:nowrap}
#dtip.on{opacity:1}
#dtip b{font-weight:600}
#dtip .dt-p{color:#9fb2d6;margin-left:8px}
#dtip .dot{width:8px;height:8px;border-radius:50%;margin-right:6px}
/* ---------- 堆叠条形图 ---------- */
.mini-legend{display:flex;flex-wrap:wrap;align-items:center;gap:14px;font-size:11.5px;color:var(--sub);margin:-2px 0 10px}
.mini-legend span{display:flex;align-items:center;gap:5px}
.mini-legend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.bar-stack{flex:1;display:flex;height:16px;border-radius:6px;overflow:hidden;background:#f2f5fa;min-width:80px}
.bar-stack i{display:block;height:100%;transition:filter .12s}
.bar-stack i:hover{filter:brightness(1.1) saturate(1.15)}
.bar-nums{display:flex;align-items:center;gap:5px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--sub);flex:0 0 auto;min-width:104px;justify-content:flex-end}
.bar-nums b{font-weight:600;color:var(--txt)}
.bar-nums .bn{display:flex;align-items:center;gap:3px}
.bar-nums i{width:7px;height:7px;border-radius:50%;display:inline-block}
.bar-nums .sep{color:#cfd6e2}
/* ---------- 可编辑 TODO 清单 ---------- */
.todo-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 8px}
.todo-row{display:flex;align-items:flex-start;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.todo-row:last-child{border-bottom:0}
.todo-row .cb{width:15px;height:15px;margin-top:4px;accent-color:var(--green);cursor:pointer;flex:0 0 auto}
.todo-row .tw{flex:1;min-width:0;font-size:13px;line-height:1.55}
.todo-row.done .tw{color:#a3adbb}
.todo-row.done .todo-item{text-decoration:line-through}
.todo-meta{display:flex;align-items:center;gap:7px;flex:0 0 auto;font-size:11.5px;color:var(--sub)}
.todo-meta .tag{margin:0}
.ed-inline{display:inline-block;min-width:40px;padding:1px 4px;margin-left:-4px;border-radius:5px;border:1px dashed transparent;outline:none;color:inherit;font:inherit}
.ed-inline:hover{border-color:#d7dde7;background:#fafbfd}
.ed-inline:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(42,91,215,.1)}
.ed-inline:empty:before{content:attr(data-ph);color:#b3bcc9}
.ed-inline:empty:focus:before{content:""}
select.ed-sel.mini{padding:1px 4px;font-size:11.5px;border-radius:6px}
/* ---------- 编辑模式 ---------- */
#save-bar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:120;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(16,24,40,.18);padding:9px 10px 9px 18px;align-items:center;gap:12px;max-width:calc(100vw - 32px)}
#save-bar.on{display:flex}
#save-bar .sb-tip{font-size:13px;color:var(--sub);white-space:nowrap}
#save-bar .sb-tip b{color:var(--red);font-size:14px}
#save-bar button{border:none;border-radius:8px;padding:8px 18px;font-size:13px;cursor:pointer;white-space:nowrap;transition:opacity .15s,background .15s,color .15s}
#save-btn{background:var(--green);color:#fff;font-weight:600}
#save-btn:hover{opacity:.92}
#save-btn:disabled{opacity:.55;cursor:default}
#cancel-btn{background:#f2f4f8;color:var(--sub);border:1px solid transparent}
#cancel-btn:hover{color:var(--red);background:var(--red-bg)}
/* 保存结果轻提示：自动消失，无需点击确认 */
#toast{position:fixed;left:50%;top:20px;transform:translateX(-50%) translateY(-10px);z-index:200;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--green);border-radius:10px;box-shadow:0 12px 32px rgba(16,24,40,.18);padding:11px 22px;font-size:13.5px;color:var(--txt);opacity:0;pointer-events:none;transition:opacity .22s,transform .22s;max-width:80vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-left-color:var(--red);white-space:normal}
/* ---------- 通用弹窗（替代浏览器原生 prompt / confirm） ---------- */
.uimask{display:none;position:fixed;inset:0;z-index:180;background:rgba(18,26,40,.38);backdrop-filter:blur(3px);align-items:center;justify-content:center;padding:24px}
.uimask.on{display:flex}
.uidlg{width:min(520px,100%);max-height:86vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 24px 64px rgba(16,24,40,.26),0 2px 6px rgba(16,24,40,.08);animation:uiIn .18s cubic-bezier(.2,.8,.3,1)}
@keyframes uiIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.uh{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 0}
.uh>div{min-width:0}
.uh h3{font-size:15.5px;font-weight:600;line-height:1.4;letter-spacing:.2px}
.uh .uh-sub{margin-top:3px;font-size:12px;color:var(--sub);line-height:1.5}
.uh .uh-ico{width:30px;height:30px;flex:0 0 auto;border-radius:9px;background:var(--blue-bg);color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;margin-top:1px}
.uh .uh-ico.warn{background:var(--red-bg);color:var(--red)}
.uh .ux{margin-left:auto;border:0;background:none;color:#a7b0be;font-size:14px;line-height:1;cursor:pointer;padding:4px 6px;border-radius:7px}
.uh .ux:hover{background:#f2f4f8;color:var(--txt)}
.ubody{padding:16px 22px 2px}
.ufoot{display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 22px 20px}
.ufoot-tip{margin-right:auto;font-size:11.5px;color:#9aa5b6}
.uidlg.sm{width:min(430px,100%)}
.btn-main{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600;padding:7px 18px}
.btn-main:hover{background:#1f4cc4;border-color:#1f4cc4;color:#fff}
.btn-danger{background:var(--red);border-color:var(--red);color:#fff;font-weight:600;padding:7px 18px}
.btn-danger:hover{background:#a92b34;border-color:#a92b34;color:#fff}
.umsg{font-size:13.5px;color:#39435a;line-height:1.8;white-space:pre-line}
.umsg b{color:var(--txt)}
/* 表单控件 */
.fld{display:block;margin-bottom:14px}
.fld>.lb{display:flex;align-items:center;gap:5px;font-size:12.5px;color:#4a5568;font-weight:600;margin-bottom:6px}
.fld>.lb i{color:var(--red);font-style:normal;font-weight:400}
.fld>.lb em{font-style:normal;font-weight:400;color:#a3adbb;font-size:11.5px}
.fld textarea,.fld input[type=text],.fld input:not([type]),.fld input[type=date],.fld input[type=time]{width:100%;border:1px solid var(--line);border-radius:9px;background:#fbfcfe;padding:9px 11px;font:inherit;font-size:13px;color:var(--txt);outline:none;transition:border-color .15s,box-shadow .15s,background .15s;resize:vertical}
.fld textarea{line-height:1.6;min-height:38px}
.fld textarea:focus,.fld input:focus{border-color:var(--blue);background:#fff;box-shadow:0 0 0 3px rgba(42,91,215,.12)}
.fld textarea::placeholder{color:#b3bcc9}
.fld .bad{border-color:#e8a9a9;background:#fff6f6;animation:shake .24s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld-row>.fld{margin-bottom:14px}
/* 待办表单：截止时间（1.2）+ 重要程度（1）同行 */
.fld-row.c2{grid-template-columns:1.2fr 1fr}
@media(max-width:520px){.fld-row,.fld-row.c2{grid-template-columns:1fr;gap:0}}
/* 待办表单弹窗：比常规弹窗宽一点，正文滚动、按钮常驻底部 */
.uidlg.form{width:min(580px,100%);max-height:88vh;overflow:hidden;display:flex;flex-direction:column}
.uidlg.form .ubody{flex:1 1 auto;min-height:0;overflow:auto;padding-bottom:4px}
.uidlg.form .ufoot{flex:0 0 auto;border-top:1px solid var(--line);background:#fff;padding:14px 22px 16px;margin-top:0}
.uidlg.form .uh{padding-bottom:2px}
.dt{display:flex;gap:8px}
.dt input[type=date]{flex:1.3;min-width:0}
.dt input[type=time]{flex:1;min-width:0}
.pri{display:flex;gap:6px}
.pri-b{flex:1;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:9px;font-size:13px;color:var(--sub);cursor:pointer;transition:.15s;font-weight:500}
.pri-b:hover{border-color:#c9d2e0;color:var(--txt)}
.pri-b.on[data-v="高"]{background:var(--red-bg);border-color:#f0c2c2;color:var(--red);font-weight:600}
.pri-b.on[data-v="中"]{background:var(--yellow-bg);border-color:#f0dfae;color:var(--yellow);font-weight:600}
.pri-b.on[data-v="低"]{background:var(--gray-bg);border-color:#dde3ec;color:#5b6678;font-weight:600}
/* 待办到期时间徽标 */
.due{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums;color:#5b6678;background:#f3f5f9;border-radius:6px;padding:1px 7px;font-size:11.5px;white-space:nowrap}
.due::before{content:"⏱";font-size:10px;opacity:.7}
.due.late{background:var(--red-bg);color:var(--red)}
.due.none{background:transparent;color:#a9b3c2}
.due.none::before{content:none}
.todo-note{margin-top:3px;color:#7d8798;font-size:11.5px;line-height:1.55}
.todo-item{font-weight:500;word-break:break-word}
.todo-edit{padding:1px 9px;font-size:11.5px;border-radius:999px;color:#5b6678;background:#fff;flex:0 0 auto}
.todo-edit:hover{color:var(--blue);border-color:#b9cdf5;background:#f4f7ff}
.todo-del{padding:1px 9px;font-size:11.5px;border-radius:999px;color:#5b6678;background:#fff;flex:0 0 auto}
.todo-del:hover{color:var(--red);border-color:#f0c2c2;background:var(--red-bg)}
.row-ops{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
/* 风险提示表：勾选列/等级居中、操作贴右缘，别在中间留一大段空白 */
.risk-tbl th:nth-child(1),.risk-tbl td:nth-child(1){text-align:center}
.risk-tbl th:nth-child(5),.risk-tbl td:nth-child(5){text-align:center}
.risk-tbl th:last-child,.risk-tbl td:last-child{text-align:right}
.risk-tbl input[type=checkbox]{width:14px;height:14px;accent-color:var(--green);cursor:pointer;vertical-align:middle}
.risk-tbl tr.rdone td{color:#a3adbb}
/* 最新风险提示：自动检测区 + 工具条 */
.ov-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:-2px 0 10px}
.ov-btns{margin-left:auto;display:flex;gap:8px}
.auto-wrap{background:#fbfcfe;border:1px solid #e6edf8;border-radius:10px;padding:9px 12px;margin-bottom:12px}
.auto-title{font-size:11.5px;color:#8b96a7;margin-bottom:4px}
.auto-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-top:1px dashed #e8eef7;font-size:12.5px}
.auto-row:first-of-type{border-top:0}
.ai-badge{flex:0 0 auto;font-size:10.5px;padding:1px 7px;border-radius:999px;background:#eaf1ff;color:#2a5bd7;border:1px solid #d3e0fb}
.ai-dom,.ai-obj{flex:0 0 auto;color:#5b6678;font-variant-numeric:tabular-nums}
.ai-item{flex:1;min-width:0;color:var(--txt);word-break:break-word}
.ai-lv{flex:0 0 auto;display:flex}
.ai-add{flex:0 0 auto;padding:1px 10px;font-size:11.5px;border-radius:999px;color:var(--blue);border-color:#c7d8f8;background:#f5f8ff}
.ai-add:hover{background:#eaf1ff;border-color:#a8c4f5}
.ai-ops{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;margin-left:2px}
.ai-del{flex:0 0 auto;padding:1px 9px;font-size:11.5px;border-radius:999px;color:#5b6678;background:#fff}
.ai-del:hover{color:var(--red);border-color:#f0c2c2;background:var(--red-bg)}
.ai-restore{float:right;font-size:11px;color:var(--blue);cursor:pointer}
.ai-restore:hover{text-decoration:underline}
.auto-ok{font-size:12px;color:#1a7f37;background:#f2faf4;border:1px solid #d9f0e0;border-radius:10px;padding:7px 12px;margin-bottom:12px}
/* 自动检测区挂在待办卡内：与列表之间留一点距离，底部不要多出空白 */
#ch-todo .auto-wrap{margin:12px 0 2px}
#ch-todo .auto-ok{margin-bottom:0}
td.ed{cursor:text;outline:none}
td.ed:hover{background:var(--yellow-bg)}
td.ed:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--blue);border-radius:4px}
td.ed.dirty{background:var(--yellow-bg)}
td select.ed-sel{padding:2px 6px;border:1px solid var(--line);border-radius:6px;font-size:12px;background:#fff}
#mbody input.mv{width:100%;padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;outline:none}
#mbody input.mv:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,91,215,.12)}
#mbody select.mv{width:100%;padding:5px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;background:#fff;outline:none}
/* ---------- 谈话跟进 ---------- */
.talk-wrap{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.talk-h{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.talk-h h3{margin:0}
.talk-h .btn{margin-left:auto;padding:4px 12px;font-size:12px}
.talk-item{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:10px;background:#fafbfd}
.talk-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--sub)}
.talk-meta b{font-size:13px;color:var(--txt)}
.talk-meta .btn{margin-left:auto;padding:2px 10px;font-size:12px}
.talk-c{margin-top:6px;font-size:13px;white-space:pre-wrap;line-height:1.6}
.talk-form{border:1px solid #dbe4fb;border-radius:10px;padding:14px;background:#f7f9ff;margin-bottom:12px}
.talk-form .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.talk-form input,.talk-form select,.talk-form textarea{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit;background:var(--card);outline:none}
.talk-form input:focus,.talk-form select:focus,.talk-form textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(42,91,215,.12)}
.talk-form textarea{width:100%;resize:vertical;min-height:96px;line-height:1.6}
.talk-form .acts{display:flex;gap:8px;justify-content:flex-end}
.btn.primary{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn.primary:hover{opacity:.92;background:var(--green);border-color:var(--green)}
/* ---------- 分段按钮 / 分类标签 / 照片墙 ---------- */
.seg-group{display:flex;align-items:center;gap:6px}
.seg{padding:5px 12px;border:1px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:13px;color:var(--sub);transition:.15s}
.seg:hover{border-color:#c9d2e0;color:var(--txt)}
.seg.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:500}
.ac-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:16px 0 14px}
.ac-tab{padding:9px 18px;font-size:13.5px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;user-select:none;transition:color .15s,border-color .15s}
.ac-tab:hover{color:var(--txt)}
.ac-tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.subnav{display:none;flex-direction:column;gap:1px;margin:2px 0 6px 15px;padding-left:11px;border-left:1px solid #e5eaf2}
nav .tab.active + .subnav{display:flex}
.subnav-i{font-size:12.5px;color:var(--sub);padding:6px 10px;border-radius:7px;cursor:pointer;white-space:nowrap;user-select:none;transition:background .15s,color .15s}
.subnav-i:hover{background:#f4f7fc;color:#1d2735}
.subnav-i.active{color:var(--blue);font-weight:600;background:rgba(42,91,215,.07)}
.plan-cat{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 12px;margin:16px 0 6px;background:#f5f8fd;border-left:3px solid var(--blue);border-radius:6px;font-size:13.5px;cursor:pointer;user-select:none;transition:background .12s}
.plan-cat:hover{background:#eaf2fd}
.plan-sec>.plan-cat{margin-bottom:6px}
.plan-sec.folded>.plan-body{display:none}
.plan-sec.folded>.plan-cat{margin-bottom:6px}
.pc-caret{display:inline-block;width:12px;font-size:10px;line-height:1;color:var(--sub);transform:rotate(0deg);transition:transform .16s;flex:none}
.plan-sec.folded>.plan-cat .pc-caret{transform:rotate(-90deg)}
.plan-cat.sub{background:#fafbfe;border-left-color:#b9cbe8;font-size:13px}
.plan-cat b{font-weight:600}
.plan-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:0 0 4px}
.plan-tbl th{background:#f8fafd;color:var(--sub);font-weight:600;padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.plan-tbl td{padding:6px 10px;border-bottom:1px solid #f1f4f9}
.plan-tbl tr:hover td{background:#fafcff}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 6px}
/* 班级胶囊与「展示形式」同一行：左边胶囊自动换行，右边固定在行首右端 */
.board-head{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin:0 0 8px}
.board-head .chips{flex:1 1 420px;min-width:0;margin:0}
.board-seg{flex:0 0 auto;margin-left:auto;padding-top:1px}
.chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--card);font-size:13px;color:var(--txt);transition:.15s}
.chip:hover{border-color:#c9d2e0;box-shadow:var(--sh1)}
.chip .n{font-weight:700;color:var(--blue);font-variant-numeric:tabular-nums}
.chip.active{background:var(--blue-bg);border-color:#c3d0f7;color:var(--blue);font-weight:600}
.chip.active .n{color:var(--blue)}
.chip.gray .n{color:var(--sub)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px;padding:4px 2px 8px}
.pcard{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card);cursor:pointer;transition:box-shadow .18s,transform .18s;box-shadow:var(--sh1)}
.pcard:hover{box-shadow:var(--sh2);transform:translateY(-2px)}
.pcard .ph{width:100%;aspect-ratio:3/4;background:var(--gray-bg);display:flex;align-items:center;justify-content:center;overflow:hidden}
.pcard .ph img{width:100%;height:100%;object-fit:cover;display:block}
.pcard .ph .ini{font-size:30px;font-weight:700;color:#b6bcc4}
.pcard .nm{padding:7px 8px 2px;font-size:13px;font-weight:600;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .cl{padding:0 8px 9px;font-size:11px;color:var(--sub);text-align:center}
.mphoto{width:96px;height:128px;object-fit:cover;border-radius:10px;border:1px solid var(--line);float:right;margin:0 0 8px 14px;box-shadow:var(--sh1)}
/* ---------- 寝室 / 楼层 / 成员胶囊 ---------- */
.floor-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin:10px 0 14px}
.floor-card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;cursor:pointer;transition:.15s}
.floor-card:hover{border-color:#c9d2e0;box-shadow:var(--sh1);transform:translateY(-1px)}
.floor-card.on{background:var(--blue-bg);border-color:#c3d0f7}
.floor-card .fh{font-size:13px;font-weight:700;line-height:1.3;white-space:nowrap}
.floor-card .fh .fb{font-size:11px;color:var(--sub);font-weight:400;margin-right:2px}
.floor-card .fn{font-size:11px;color:var(--sub);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.floor-card .fn b{color:var(--blue);font-size:12px}
.floor-card .fd{position:absolute;right:8px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--red)}
.floor-sum{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--sub);margin:4px 0 12px}
.floor-sum b{color:var(--txt)}
.room-card{border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;box-shadow:var(--sh1)}
.room-card .rc-h{background:#f8fafd;padding:8px 14px;font-weight:600;font-size:13px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #eef1f6}
.room-card .rc-h .n{color:var(--blue);font-weight:700}
.room-card .rc-h .wz{background:var(--yellow-bg);color:var(--yellow);font-size:11px;padding:1px 7px;border-radius:6px;font-weight:400}
.room-card .rc-b{display:flex;flex-wrap:wrap;gap:8px;padding:11px 14px}
.member{display:inline-flex;align-items:center;gap:7px;padding:3px 10px 3px 3px;border:1px solid var(--line);border-radius:9px;cursor:pointer;font-size:13px;background:var(--card);transition:.15s}
.member:hover{border-color:#c9d2e0;background:#f8fafd}
.member img,.member .mi{width:24px;height:24px;border-radius:7px;object-fit:cover;background:var(--gray-bg);display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub);flex:0 0 auto}
.member .wz{background:var(--yellow-bg);color:var(--yellow);font-size:10px;padding:0 5px;border-radius:5px;font-weight:700}
/* 按去向的胶囊图：两栏（窄屏回落单栏） */
.pill-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
.pill-2 .room-card{margin-bottom:0}
@media(max-width:900px){.pill-2{grid-template-columns:1fr}}
/* ---------- 版本更新 / 成绩跟进 ---------- */
.btn.danger{color:var(--red);border-color:#f0c9c9;background:#fff}
.btn.danger:hover{background:#fdf2f2;border-color:#e8b4b4}
.upd-bar{position:sticky;top:54px;z-index:40;display:flex;align-items:center;gap:10px;flex-wrap:wrap;
  margin-bottom:14px;padding:9px 14px;border:1px solid #cfe0ff;border-radius:10px;
  background:linear-gradient(90deg,#f2f7ff,#f8fbff);font-size:13px;color:#1e3a8a;box-shadow:var(--sh1)}
.upd-bar b{font-weight:700}
.upd-bar .upd-notes{color:#5b6b86;font-size:12px;max-width:460px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upd-bar .sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.sf-link{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:500}
.sf-link:hover{text-decoration:underline}
.sf-chk{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:11px;font-weight:400;color:#7c8699;cursor:pointer;user-select:none}
.sf-chk input{width:12px;height:12px;margin:0;accent-color:#2b6cff;cursor:pointer}
.fp-tbl{width:100%;font-size:12.5px}
.fp-tbl th{font-size:11.5px;padding:6px 6px}
.fp-tbl td{padding:6px 6px;border-bottom:1px solid #eef1f6;vertical-align:middle;white-space:normal}
.fp-tbl input[type=text],.fp-tbl select{padding:4px 7px;border:1px solid var(--line);border-radius:6px;font-size:12.5px;background:#fff}
.fp-tbl input.sc{width:74px}
.fp-tbl select.wy{width:82px}
.fp-tbl + .fp-tbl{margin-top:8px}
.fp-done td{background:#f5fbf7}
@media(max-width:900px){.upd-bar .upd-notes{display:none}}
</style>
</head>

<script>
const DATA = /*__WORKBENCH_DATA__*/{};
/* ---------- 编辑机制 ---------- */
const EDIT = location.protocol.startsWith("http") && !decodeURIComponent(location.pathname).includes("脱敏");
const TABLE_KEYS=["students","todos"];
/* CSV 表头可能带枚举说明（如「风险等级(高/中/低)」）：统一补一份短名，前端一律按短名取值。
   保存端 server.py 的 find_col 也做了同款容错，所以补别名不影响写回。 */
TABLE_KEYS.forEach(k=>(DATA[k]||[]).forEach(r=>{
  if(!r||typeof r!=="object")return;
  Object.keys(r).forEach(h=>{
    const i=String(h).search(/[(（]/);
    if(i<=0)return;
    const short=String(h).slice(0,i).trim();
    if(short&&r[short]===undefined)r[short]=r[h];
  });
}));
const EDITABLE = {
  students: ["毕业去向","去向确认状态","升学_报考学校","升学_结果状态","就业_单位名称","就业_地区","就业_三方合同状态","具体去向","职务","性格","特长","外住_类型","外住_起止日期","外住_审批状态","外住_安全告知","外住_紧急联系人","风险标签","待办事项","下次跟进日期","备注","材料_外住审批表","材料_安全承诺书"],
  todos: ["工作域","对象","事项","说明","风险等级","截止日期","负责人","下次跟进日期","状态"],
};
const ENUM_SEL = {"毕业去向":["考研","保研","留学","就业","考公考编","自由职业","暂无"],
                  "在校学年":["1","2","3","4","5","6"],
                  "去向确认状态":["已确认","待确认","待排查"],
                  "状态":["未开始","进行中","已完成","已关闭"],
                  "风险等级":["高","中","低"],
                  "外住_审批状态":["已通过","已退回","申请中","已审批","已到期","已过期"],
                  "外住_安全告知":["已完成","未完成","待补充"],
                  "升学_材料齐全":["齐全","缺失","待补充"],
                  "升学_结果状态":["已确认","待确认","拟录取","未通过","待补充"],
                  "材料状态":["齐全","缺失","待补充"]};
const edits={};TABLE_KEYS.forEach(k=>edits[k]={});
function editCount(){return Object.values(edits).reduce((a,m)=>a+Object.values(m).reduce((b,x)=>b+Object.keys(x).length,0),0)}
function refreshSaveBar(){
  const n=editCount(),b=$("#save-bar");if(!b)return;
  b.classList.toggle("on",!!(EDIT&&n));
  const s=$("#sb-n");if(s)s.textContent=n;
}
function edCell(t,i,c,val){
  if(EDIT&&EDITABLE[t]&&EDITABLE[t].includes(c)){
    if(ENUM_SEL[c])return '<td onclick="event.stopPropagation()"><select class="ed-sel" data-t="'+t+'" data-i="'+i+'" data-c="'+c+'">'+ENUM_SEL[c].map(o=>'<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>').join("")+'</select></td>';
    return '<td class="ed" contenteditable="true" onclick="event.stopPropagation()" data-t="'+t+'" data-i="'+i+'" data-c="'+c+'">'+esc(val)+'</td>';
  }
  return '<td>'+esc(val)+'</td>';
}
function markEdit(el,v){
  const t=el.dataset.t,i=el.dataset.i,c=el.dataset.c;
  const rec=DATA[t]&&DATA[t][i], orig=rec?(rec[c]==null?"":String(rec[c])):"";
  if(String(v)===orig){
    /* 改回原值：撤销这条待保存记录 */
    if(edits[t][i]){delete edits[t][i][c];if(!Object.keys(edits[t][i]).length)delete edits[t][i]}
    el.classList.remove("dirty");
  }else{
    edits[t][i]=edits[t][i]||{};edits[t][i][c]=v;el.classList.add("dirty");
  }
  refreshSaveBar();
}
document.addEventListener("input",e=>{if(e.target.matches(".ed[contenteditable]"))markEdit(e.target,e.target.textContent.trim())});
document.addEventListener("change",e=>{if(e.target.matches("select.ed-sel"))markEdit(e.target,e.target.value)});
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&(e.key==="s"||e.key==="S")){if(EDIT&&editCount()){e.preventDefault();saveEdits()}}
});
/** 取消：清空未保存的修改并重新加载看板（磁盘数据未动） */
async function cancelEdits(){
  const n=editCount();if(!n)return;
  const ok=await uiConfirm({
    title:"放弃这 "+n+" 处未保存的修改？",
    danger:true,
    body:"这些修改还没有写入表格，放弃后会丢失。\n· 磁盘上的 CSV 数据不会被改动\n· 页面将重新加载，回到保存前的状态",
    ok:"放弃修改",cancel:"继续编辑"
  });
  if(!ok)return;
  TABLE_KEYS.forEach(k=>edits[k]={});
  refreshSaveBar();
  location.reload();
}
/* 保存结果轻提示（toast）：自动消失，无需点确定 */
let _toastTimer=null;
function showToast(msg,err){
  const t=$("#toast");if(!t)return;
  t.textContent=msg;t.classList.toggle("err",!!err);t.classList.add("on");
  clearTimeout(_toastTimer);_toastTimer=setTimeout(()=>t.classList.remove("on"),2600);
}
/* ---------- 通用弹窗：替代浏览器原生 prompt / confirm（原生框样式不可控、还带域名） ---------- */
function uiHide(){const m=$("#uimask");if(!m)return;m.classList.remove("on");m.innerHTML="";m.onclick=null}
function uiDialog(html,opt){
  opt=opt||{};
  return new Promise(resolve=>{
    const m=$("#uimask");
    m.innerHTML='<div class="uidlg'+(opt.cls?" "+opt.cls:"")+'">'+html+'</div>';
    m.classList.add("on");
    let done=false,escH=null;
    const finish=v=>{if(done)return;done=true;if(escH)document.removeEventListener("keydown",escH);uiHide();resolve(v)};
    escH=e=>{if(e.key==="Escape"){e.preventDefault();finish(null)}};
    document.addEventListener("keydown",escH);
    m.onclick=e=>{if(e.target===m)finish(null)};
    m.querySelectorAll("[data-ok]").forEach(b=>b.onclick=()=>{
      let v=true;if(opt.onOk)v=opt.onOk(m);
      if(v===false)return;
      finish(v===undefined?true:v);
    });
    m.querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>finish(null));
    if(opt.init)opt.init(m);
    const f=m.querySelector("[data-focus]");if(f)setTimeout(()=>{try{f.focus()}catch(e){}},50);
  });
}
function uiConfirm(o){
  o=o||{};
  const html='<div class="uh"><div class="uh-ico'+(o.danger?" warn":"")+'">'+(o.danger?"!":"?")+'</div>'+
    '<div><h3>'+esc(o.title||"确认操作")+'</h3>'+(o.sub?'<div class="uh-sub">'+esc(o.sub)+'</div>':'')+'</div>'+
    '<button class="ux" data-cancel title="关闭">✕</button></div>'+
    '<div class="ubody"><div class="umsg">'+(o.body||"")+'</div></div>'+
    '<div class="ufoot"><button class="btn" data-cancel>'+esc(o.cancel||"取消")+'</button>'+
    '<button class="btn '+(o.danger?"btn-danger":"btn-main")+'" data-ok>'+esc(o.ok||"确定")+'</button></div>';
  return uiDialog(html,{cls:"sm",onOk:()=>true}).then(v=>v===true);
}
/* 待办表单（新增 / 编辑共用）：内容 / 截止时间（到分钟）/ 重要程度 / 说明（可选） */
function uiTodoForm(rec,focusKey){
  const isEdit=!!rec,pad=n=>String(n).padStart(2,"0");
  const now=new Date();
  const dflt=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  const dueRaw=String((rec&&rec["截止日期"])||"").trim();
  const dm=dueRaw.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  const dVal=dm?(dm[1]+"-"+pad(+dm[2])+"-"+pad(+dm[3])):(isEdit?"":dflt);
  const tVal=(dm&&dm[4])?(pad(+dm[4])+":"+(dm[5]||"00")):"18:00";
  const priV=String((rec&&rec["风险等级"])||"中").trim()||"中";
  const itemV=isEdit?String(rec["事项"]||""):"";
  const noteV=isEdit?String(rec["说明"]||""):"";
  const domV=isEdit?String(rec["工作域"]||""):"";
  const objV=isEdit?String(rec["对象"]||""):"";
  const html='<div class="uh"><div class="uh-ico">'+(isEdit?"✎":"＋")+'</div>'+
    '<div><h3>'+(isEdit?"编辑待办":"新增待办")+'</h3><div class="uh-sub">'+
      (isEdit?"改完保存，直接写回跨域待办表":"填好直接写入跨域待办表，之后可点「编辑」继续改")+'</div></div>'+
    '<button class="ux" data-cancel title="关闭">✕</button></div>'+
    '<div class="ubody">'+
      '<label class="fld"><span class="lb">内容<i>*</i></span>'+
        '<textarea id="td-item" data-focus rows="2" maxlength="200" placeholder="要做什么？例：补录 2023 级就业签约信息">'+esc(itemV)+'</textarea></label>'+
      '<div class="fld-row">'+
        '<label class="fld"><span class="lb">工作域</span>'+
          '<input type="text" id="td-dom" maxlength="20" value="'+esc(domV)+'" placeholder="毕业班 / 羽毛球协会"></label>'+
        '<label class="fld"><span class="lb">对象</span>'+
          '<input type="text" id="td-obj" maxlength="40" value="'+esc(objV)+'" placeholder="全体238人 / 常浩林"></label>'+
      '</div>'+
      '<div class="fld-row c2">'+
        '<label class="fld"><span class="lb">截止时间'+(isEdit?'<em>可留空</em>':'<i>*</i>')+'</span>'+
          '<div class="dt"><input type="date" id="td-date" value="'+dVal+'"><input type="time" id="td-time" value="'+tVal+'" step="60"></div></label>'+
        '<div class="fld"><span class="lb">重要程度</span>'+
          '<div class="pri" id="td-pri">'+
            '<button type="button" class="pri-b'+(priV==="高"?" on":"")+'" data-v="高">高</button>'+
            '<button type="button" class="pri-b'+(priV==="中"?" on":"")+'" data-v="中">中</button>'+
            '<button type="button" class="pri-b'+(priV==="低"?" on":"")+'" data-v="低">低</button></div></div>'+
      '</div>'+
      '<label class="fld"><span class="lb">说明<em>可选</em></span>'+
        '<textarea id="td-note" rows="2" maxlength="300" placeholder="补充背景、对接人、注意事项…">'+esc(noteV)+'</textarea></label>'+

/* 截止时间显示：完整时间 → 「11-20 18:00」；只有日期 → 「11-20」；逾期未完成标红 */
function dueHtml(v,done){
  const s=String(v||"").trim();
  const m=s.match(/^(\d{4})[-/](\d{1,2})[-/](\d{1,2})(?:[ T](\d{1,2}):(\d{2}))?/);
  if(!m)return '<span class="due none" title="未设置截止时间">待补充</span>';
  const y=+m[1],mo=+m[2],d=+m[3],hh=m[4]?String(+m[4]).padStart(2,"0"):"",mi=m[5]||"";
  const now=new Date();
  const t=m[4]?new Date(y,mo-1,d,+m[4],+mi||0):new Date(y,mo-1,d,23,59);
  const late=!done&&t<now;
  const lb=(y===now.getFullYear()?"":y+"-")+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")+(hh?" "+hh+":"+mi:"");
  return '<span class="due'+(late?" late":"")+'" title="截止 '+y+"-"+String(mo).padStart(2,"0")+"-"+String(d).padStart(2,"0")+(hh?" "+hh+":"+mi:"")+(late?"（已逾期）":"")+'">'+lb+'</span>';
}

/* ---------- 通用分页：各栏目独立记忆页码与每页条数 ---------- */
const PG={},PG_DRAW={};        /* PG[key]={p,s}  PG_DRAW[key]=重绘该栏目的函数 */
function pgState(key,def){
  if(!PG[key])PG[key]={p:1,s:(def===undefined?10:def)};
  return PG[key];
}
function pgReset(key){pgState(key).p=1}
function pgSlice(key,rows,def){
  const st=pgState(key,def),total=rows.length;
  const ps=st.s>0?st.s:(total||1);
  const pages=Math.max(1,Math.ceil(total/ps));
  if(st.p>pages)st.p=pages;
  if(st.p<1)st.p=1;
  const start=(st.p-1)*ps;
  return rows.slice(start,start+ps);
}
function pgBar(key,total,unit,def){
  if(!total)return "";
  const st=pgState(key,def),ps=st.s>0?st.s:(total||1);
  const pages=Math.max(1,Math.ceil(total/ps));
  const u=unit||"条",on=st.s>0;
  return '<div class="pager">'+
    '<span class="small">共 '+total+' '+u+(on?' · 第 '+st.p+' / '+pages+' 页':'')+'</span>'+
    '<button class="btn" onclick="pgGo(\''+key+'\',1)"'+(st.p<=1?' disabled':'')+'>首页</button>'+
    '<button class="btn" onclick="pgGo(\''+key+'\','+(st.p-1)+')"'+(st.p<=1?' disabled':'')+'>上一页</button>'+
    '<button class="btn" onclick="pgGo(\''+key+'\','+(st.p+1)+')"'+(st.p>=pages?' disabled':'')+'>下一页</button>'+
    '<button class="btn" onclick="pgGo(\''+key+'\','+pages+')"'+(st.p>=pages?' disabled':'')+'>末页</button>'+
    '<span class="small" style="margin-left:6px">每页</span>'+
    '<select onchange="pgSetSize(\''+key+'\',this.value)">'+
      [10,20,50,100,0].map(n=>'<option value="'+n+'"'+(st.s===n?' selected':'')+'>'+(n?n+' '+u:'全部')+'</option>').join("")+
    '</select>'+
  '</div>';
}
function pgGo(key,p){
  pgState(key).p=parseInt(p,10)||1;
  const f=PG_DRAW[key];if(f)f();
}
function pgSetSize(key,v){

  const YEL=["待审核","申请中","进行中","待确认","待补充","中","未开始","待定"];
  const GRN=["已通过","已认定","齐全","已完成","已落实","已关闭","低","有","是"];
  if(RED.some(x=>t.includes(x)))return '<span class="tag tr">'+esc(t)+'</span>';
  if(GRN.some(x=>t===x))return '<span class="tag tg">'+esc(t)+'</span>';

const PALETTE=["#2f6fed","#12a594","#e8890c","#8b5cf6","#d6455d","#0ea5c6","#7c8db5","#b08900"];
function donutTip(e,el){

function donutTipHide(){const t=$("#dtip");if(t)t.classList.remove("on")}
function donut(el,items){
  const arr=(items||[]).filter(i=>i&&i.v>0).sort((a,b)=>b.v-a.v);
  const total=arr.reduce((a,b)=>a+b.v,0);
  if(!total){$(el).innerHTML='<div class="empty">暂无数据</div>';return}
  const col=it=>DEST_COLOR[it.k]||PALETTE[Math.max(0,arr.indexOf(it))%PALETTE.length];
  const pt=(r,deg)=>{const a=deg*Math.PI/180;return [(21+r*Math.cos(a)).toFixed(2),(21+r*Math.sin(a)).toFixed(2)]};
  const attrs=it=>' data-k="'+esc(it.k)+'" data-v="'+it.v+'" data-p="'+(it.v/total*100).toFixed(1)+'" data-c="'+col(it)+'" onmousemove="donutTip(event,this)" onmouseleave="donutTipHide()"';
  let a0=-90,paths="";
  if(arr.length===1){        /* 单一去向：整环 */
    paths='<circle class="seg" cx="21" cy="21" r="15.9" fill="none" stroke="'+col(arr[0])+'" stroke-width="6.4"'+attrs(arr[0])+'/>';
  }else{
    arr.forEach(it=>{
      const ang=it.v/total*360;if(ang<=0)return;
      const gap=ang>3.2?0.9:0,s=a0+gap,e=a0+ang-gap;
      const p0=pt(15.9,s),p1=pt(15.9,e);
      const large=(e-s)>180?1:0;
      paths+='<path class="seg" d="M'+p0[0]+' '+p0[1]+'A15.9 15.9 0 '+large+' 1 '+p1[0]+' '+p1[1]+'" fill="none" stroke="'+col(it)+'" stroke-width="6.4" stroke-linecap="butt"'+attrs(it)+'/>';
      a0+=ang;
    });
  }
  const svg='<svg class="donut-svg" width="168" height="168" viewBox="0 0 42 42" role="img">'+paths+
    '<text class="donut-c" x="21" y="20.4">'+total+'</text><text class="donut-cl" x="21" y="25.2">总人数</text></svg>';
  const legend='<div class="donut-legend">'+arr.map(it=>'<div><span class="dot" style="background:'+col(it)+'"></span><span class="nm">'+esc(it.k)+'</span><span class="dv">'+it.v+' 人</span><span class="dp">'+(it.v/total*100).toFixed(1)+'%</span></div>').join("")+'</div>';

}

function todoSorted(){

async function editTodo(i,focusKey){
  const rec=DATA.todos&&DATA.todos[i];
  if(!rec||!EDIT)return;
  const v=await uiTodoForm(rec,focusKey);
  if(!v)return;
  const cells={"事项":v.事项,"说明":v.说明,"工作域":v.工作域,"对象":v.对象,"截止日期":v.截止日期,"风险等级":v.风险等级};
  const same=Object.keys(cells).every(k=>String(rec[k]||"").trim()===String(cells[k]||"").trim());
  if(same){showToast("没有改动");return}
  try{
    const r=await fetch("/api/save",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({todos:[{row:i,cells:cells}]})});
    const j=await r.json();

    refreshSaveBar();renderTodoCard();
    showToast("已保存修改");

}

async function delTodo(i){
  const rec=DATA.todos&&DATA.todos[i];
  if(!rec||!EDIT)return;
  const ok=await uiConfirm({title:"删除这条待办？",danger:true,ok:"删除",
    body:"「"+esc(String(rec["事项"]||"").trim()||"—")+"」\n· 删除后不可恢复，原表会自动备份到「备份」目录\n· 如果只是做完了，请用左侧勾选标记完成"});
  if(!ok)return;
  try{
    const r=await fetch("/api/todo/del",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({row:i,id:String(rec["编号"]||""),item:String(rec["事项"]||"")})});
    const j=await r.json();
    if(!j.ok){showToast("删除失败："+(j.error||"未知错误"),true);return}

    DATA.todos.forEach((t,k)=>t._i=k);

    Object.keys(old).forEach(k=>{const n=+k;if(n===i)return;neu[n>i?n-1:n]=old[k]});
    edits.todos=neu;
    refreshSaveBar();renderTodoCard();
    showToast("已删除这条待办");

}

/* ---------- 自动检测：按当前数据实时算出「该办但还没进待办表」的问题 ----------
   事项文案固定（数字放「对象」列），便于用关键词与待办表已有记录去重。 */
let AUTO_ISSUES=[];
function detectIssues(){
  const out=[];
  const add=(dom,obj,item,lv,kw)=>out.push({dom:dom,obj:obj,item:item,lv:lv,kw:kw});
  const has=(x,re)=>re.test(String(x||""));
  /* 1) 外住已退回 */
  const wzBack=S.filter(x=>has(x["外住_审批状态"],/退回|驳回|不通过/));
  if(wzBack.length)add("毕业班",wzBack.length+" 人","外住审批已退回但仍在外住名单中，需跟进处置","高",["外住","退回"]);
  /* 2) 材料缺失 */
  const matBad=S.filter(x=>Object.values(x).some(v=>String(v).trim()==="缺失"));
  if(matBad.length)add("毕业班",matBad.length+" 人","学生材料标注为缺失，需补齐","中",["材料"]);
  /* 3) 手机号位数异常 */
  const badPhone=S.filter(x=>{const p=String(x["手机号"]||"").replace(/\D/g,"");return p&&p.length!==11});
  if(badPhone.length)add("毕业班",badPhone.length+" 人","手机号位数异常，需核对更正","中",["手机号"]);
  /* 4) 外住信息不全（有外住记录但起止日期/紧急联系人缺） */
  const wzLack=S.filter(x=>String(x["外住_审批状态"]||"").trim()&&(!String(x["外住_起止日期"]||"").trim()||!String(x["外住_紧急联系人"]||"").trim()));
  if(wzLack.length)add("毕业班",wzLack.length+" 人","外住起止日期/紧急联系人缺失，需补全","中",["外住"]);
  /* 5) 毕业去向未确定 */
  const noDest=S.filter(x=>{const d=String(x["毕业去向"]||"").trim();return !d||d==="暂无"});
  if(noDest.length)add("毕业班",noDest.length+" 人","毕业去向未确定，需逐一确认","高",["去向"]);
  /* 6) 学生风险标签 */
  if(stuRisk.length)add("毕业班",stuRisk.length+" 人","存在风险标签的学生，需跟进","高",["风险"]);
  /* 7) 学业警示 */
  const aw=(DATA.academic&&DATA.academic.warnings)||[];
  if(aw.length)add("毕业班",aw.length+" 人","学业警示学生需安排谈话并记录","中",["学业"]);
  /* 8) 谈话跟进缺失：有风险/警示但本学期无谈话记录 */
  const talkSid=new Set((DATA.talks||[]).map(t=>String(t["学号"]||"").trim()).filter(Boolean));
  const noTalk=stuRisk.filter(x=>!talkSid.has(String(x["学号"]||"").trim()));
  if(noTalk.length)add("毕业班",noTalk.length+" 人","风险学生本学期尚无谈话记录，需补录","中",["谈话"]);
  /* 9) 证件照缺失：已导入过照片（存在缩略图）但仍有学生没有，提示补齐 */
  if(anyPhoto()){
    const noPhoto=S.filter(x=>!hasPhotoOf(x["学号"]));
    if(noPhoto.length)add("毕业班",noPhoto.length+" 人","部分学生缺少证件照，需补拍或导入","低",["证件照"]);
  }
  /* 与「未完成」的待办按关键词去重：事项里同时包含全部关键词即视为已加入 */
  const live=T.filter(t=>!todoDone(t));
  AUTO_ISSUES=out.map(o=>Object.assign({},o,{inTodo:live.some(t=>o.kw.every(k=>String(t["事项"]||"").indexOf(k)>=0))}));
  return AUTO_ISSUES;
}
async function postTodo(obj){
  try{
    const r=await fetch("/api/todo/add",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(obj)});
    const j=await r.json();
    if(!j.ok){showToast("新增失败："+(j.error||"未知错误"),true);return null}
    j.record._i=j.index;DATA.todos.push(j.record);

  }catch(err){showToast("新增失败（未连接本地编辑服务）："+err,true);return null}
}

/* ---------- 自动检测区：挂在待办清单下方 ----------
   每行可「＋ 加入待办」写入表格，或「✕ 删除」= 忽略（本机记住，不再提示）。 */
const IGN_KEY="wb_ignored_issues";
function issueKey(it){return String(it.dom||"")+"|"+String(it.item||"")}
function ignoredSet(){
  try{return new Set(JSON.parse(localStorage.getItem(IGN_KEY)||"[]")||[])}catch(e){return new Set()}
}
function saveIgnored(set){
  try{localStorage.setItem(IGN_KEY,JSON.stringify([...set]))}catch(e){}
}
function ignoreIssue(i){
  const it=AUTO_ISSUES[i];if(!it)return;
  const s=ignoredSet();s.add(issueKey(it));saveIgnored(s);
  renderTodoCard();
  showToast("已忽略这条检测项，不再提示");
}
function restoreIgnored(){
  saveIgnored(new Set());renderTodoCard();
  showToast("已恢复全部被忽略的检测项");
}
function renderAutoBlock(){
  const iss=detectIssues(),ign=ignoredSet();
  const pend=iss.filter(it=>!it.inTodo&&!ign.has(issueKey(it)));
  const hidden=iss.filter(it=>!it.inTodo&&ign.has(issueKey(it))).length;
  const title='<div class="auto-title">自动检测 · 按当前数据发现、还没进待办的问题'+
    (hidden?'<span class="ai-restore" onclick="restoreIgnored()">已忽略 '+hidden+' 项 · 恢复</span>':'')+'</div>';
  if(!pend.length){
    return '<div class="auto-wrap">'+title+
      '<div class="auto-ok">✓ 没有新的自动检测项'+(iss.length?'（检测到的 '+iss.length+' 项都已在待办表中）':'')+'</div></div>';
  }
  const rows=pend.map(it=>{
    const i=iss.indexOf(it);
    return '<div class="auto-row"><span class="ai-badge">自动</span><span class="ai-dom">'+esc(it.dom)+'</span>'+
      '<span class="ai-obj">'+esc(it.obj)+'</span><span class="ai-item">'+esc(it.item)+'</span>'+
      '<span class="ai-lv">'+tag(it.lv)+'</span>'+
      '<span class="ai-ops">'+
      (EDIT?'<button class="btn ai-add" onclick="adoptIssue('+i+')">＋ 加入待办</button>':'')+
      '<button class="btn ai-del" onclick="ignoreIssue('+i+')" title="忽略这条检测项">✕ 删除</button></span></div>';
  }).join("");
  return '<div class="auto-wrap">'+title+rows+'</div>';
}

function renderPill(rows){

  return pgSlice("grad-cat-pill",rooms,10).map(r=>{
    const mem=rows.filter(x=>keyOf(x)===r).sort((x,y)=>x["姓名"].localeCompare(y["姓名"],"zh"));

}

function anaHasData(){return Object.keys(ASTU).length>0}
let AC_PLAN_MJ=null;
const AC_FOLD={};                                 // 折叠状态：「专业||类别key」-> true(收起)/false(展开)
/* 自由选课类课组：方案里列出的是可选课程（实际课程池远大于此），修够课组学分即可。
   照常显示，但标题上标注清楚，避免误读成「必须修这些课」。 */
const AC_FREE_CAT=/文化素质类|外语拓展|外语基础|学科交叉|艺术类/;
/* 课程池不固定的课组（文化素质、学科交叉）：一门课都不罗列，只标要求学分；
   子类（哲学社会科学 / 文化交流与国际视野 / 自然科学与工程技术 / 艺术体育）照常列出。
   四史类相反——固定四门课，照常罗列。 */
const AC_NO_ROWS=/文化素质类|学科交叉/;
function setAcPlanMajor(m){AC_PLAN_MJ=m;renderAcPlans()}
function acGuessCat(nm){  // 方案归口缺失时的最后兜底（正常都以方案自带归口为准）
  if(/毕业设计|毕业论文|毕业实习/.test(nm||""))return "专业必修";
  return "其他";
}
function acFoldKey(k){return (AC_PLAN_MJ||"")+"||"+k}
function acIsFolded(k,depth){const v=AC_FOLD[acFoldKey(k)];return v===undefined?true:v}  // 默认全部折叠
function acToggle(el){                       // 点类别标题：折叠/展开
  const sec=el.closest(".plan-sec");if(!sec)return;
  const k=sec.dataset.k,d=+sec.dataset.d||1;
  const nv=!acIsFolded(k,d);
  AC_FOLD[acFoldKey(k)]=nv;
  sec.classList.toggle("folded",nv);
}
function acFoldAll(fold){                    // 全部展开 / 全部收起
  const p=ACPL[AC_PLAN_MJ]||{};
  (p.cats||[]).forEach(c=>{AC_FOLD[acFoldKey(c.key)]=fold});
  AC_FOLD[acFoldKey("@other")]=fold;
  renderAcPlans();
}
function acCatRows(rows,depth){
  if(!rows.length)return "";
  rows.sort((a,b)=>String(a.t).localeCompare(String(b.t))||String(a.n).localeCompare(String(b.n)));
  return '<table class="plan-tbl" style="margin-left:'+((depth-1)*20)+'px"><tr><th>课程名[课程号]</th><th style="width:64px">学分</th><th style="width:180px">计划学年学期</th><th style="width:76px">课程性质</th><th style="width:104px">同专业修读率</th></tr>'+
    rows.map(r=>'<tr><td>'+esc(r.n)+' <span class="small" style="color:var(--sub)">['+esc(r.code)+']</span></td><td>'+(r.c||"—")+
      '</td><td class="small">'+esc(r.t||"—")+'</td><td class="small">'+esc(r.k||"—")+'</td><td class="small">'+(r.pop?r.pop+'%':'—')+'</td></tr>').join("")+
    '</table>';
}
function acCatSec(key,depth,req,rows,body,extra){
  const name=(key==="@other")?"其他课程":key.split(" > ").pop();
  const sum=rows.reduce((a,x)=>a+(x.c||0),0);
  const fold=!!body&&acIsFolded(key,depth);
  /* 课程池不固定的组（文化素质/学科交叉）不报「本类课程 N 门」：
     那是方案导出文件里的样例课数，既不是学生已修门数、也不是可选课总量，容易被误读 */
  const pool=AC_NO_ROWS.test(key);
  const meta=(req===null||req===undefined||!req?"":("要求学分 "+req+" ｜ "))+
    (pool?"自由选课，不列课程":
      (rows.length?('本类课程 '+rows.length+' 门（合计 '+sum.toFixed(1)+' 学分）'):'本类未列课程'))+(extra||"");
  return '<div class="plan-sec'+(fold?' folded':'')+'" data-k="'+esc(key)+'" data-d="'+depth+'">'+
    '<div class="plan-cat'+(depth>1?' sub':'')+'" style="margin-left:'+((depth-1)*20)+'px" onclick="acToggle(this)">'+
      '<span class="pc-caret">▼</span><b>'+esc(name)+'</b><span class="small">'+meta+'</span></div>'+
    (body?'<div class="plan-body">'+body+'</div>':'')+'</div>';
}
function renderAcPlans(){
  const box=$("#ac-plans");if(!box)return;
  const majors=Object.keys(ACPL);
  const delBtn=$("#ac-plan-del");if(delBtn)delBtn.style.display=(EDIT&&majors.length)?"inline-block":"none";
  const mbox=$("#ac-plan-majors");
  if(!majors.length){
    if(mbox)mbox.innerHTML="";
    const mt=$("#ac-plan-meta");if(mt)mt.textContent="";
    box.innerHTML='<div class="empty">尚未导入培养方案。编辑模式下点「导入培养方案」，选择「2023级xxx主修培养方案--方案内表现课程信息.xlsx」即可自动识别专业并录入类别学分要求。</div>';
    return;
  }
  if(!AC_PLAN_MJ||!ACPL[AC_PLAN_MJ])AC_PLAN_MJ=majors[0];
  if(mbox)mbox.innerHTML=majors.map(m=>'<span class="seg'+(m===AC_PLAN_MJ?" active":"")+'" onclick="setAcPlanMajor(\''+esc(m)+'\')">'+esc(m)+'</span>').join("");
  const p=ACPL[AC_PLAN_MJ]||{},codes=p.codes||{},pc=p.courses||{};
  const cats=(p.cats||[]).slice();
  const stat=(ANAPC[AC_PLAN_MJ])||{};
  const total=cats.filter(c=>(c.path||[]).length===1).reduce((a,c)=>a+(c.req||0),0);
  const mt=$("#ac-plan-meta");
  if(mt)mt.textContent="顶级类别要求合计 "+total+" 学分 ｜ 方案内课程 "+Object.keys(codes).length+" 门";
  const byCat={};
  Object.keys(codes).forEach(code=>{
    const st=stat[code]||{},pd=pc[code]||{};
    const nm=codes[code]||st.n||"";
    const key=st.cat||pd.cat||acGuessCat(nm);   // 归口优先：成绩实测 > 方案自带 > 兜底
    (byCat[key]=byCat[key]||[]).push({code:code,n:nm,c:st.c||pd.c||0,t:st.t||pd.t||"",k:st.k||pd.k||"",pop:st.pop||0});
  });
  const inPlan=k=>cats.some(c=>c.key===k);
  /* 类别树：父类别 key 是子类别 key 的前缀 */
  const nodes={};
  cats.forEach(c=>{
    const path=c.path||c.key.split(" > ");
    nodes[c.key]={key:c.key,depth:path.length,req:c.req,rows:byCat[c.key]||[],kids:[]};
  });
  cats.forEach(c=>{
    const n=nodes[c.key];if(n.depth===1)return;
    for(let i=n.depth-1;i>=1;i--){
      const pk=c.key.split(" > ").slice(0,i).join(" > ");
      if(nodes[pk]){nodes[pk].kids.push(n);return}
    }
  });
  function renderNode(n){
    const kids=n.kids.slice().sort((a,b)=>String(a.key).localeCompare(String(b.key),"zh"));
    const hideRows=AC_NO_ROWS.test(n.key);
    let body="";
    if(n.rows.length&&hideRows){
      // 自由选课池：一门都不列，也不报门数（门数是方案样例课数量，不是学生已修门数）
      body+='<div class="small" style="padding:2px 0 8px '+((n.depth-1)*20+24)+'px;color:var(--sub)">'+
        '课程池不固定，不逐门罗列；修满 '+(n.req||0)+' 学分即可（可选课程见教务选课系统）</div>';
    }else if(n.rows.length){
      body+=acCatRows(n.rows,n.depth);
    }else if(!kids.length){
      body+='<div class="small" style="padding:2px 0 8px '+((n.depth-1)*20+24)+'px;color:var(--sub)">方案未列具体课程（按课组学分凑）</div>';
    }
    kids.forEach(k=>{body+=renderNode(k)});
    let extra=(kids.length?" ｜ 含子类":"");
    if(hideRows)extra+=" ｜ 修够学分即达标";
    else if(/四史类/.test(n.key))extra+=" ｜ 固定 "+n.rows.length+" 门，修其中 1 门（"+((n.rows[0]&&n.rows[0].c)||2)+" 学分）即达标";
    else if(AC_FREE_CAT.test(n.key))extra+=" ｜ 自由选课，学分达标即可（下方为方案列出的可选课）";
    return acCatSec(n.key,n.depth,n.req,n.rows,body,extra);
  }
  const parts=[];
  cats.filter(c=>nodes[c.key].depth===1)
      .sort((a,b)=>String(a.key).localeCompare(String(b.key),"zh"))
      .forEach(c=>{ parts.push(renderNode(nodes[c.key])) });
  /* 方案里归类不到任何类别的课程 */
  const rest=[];
  Object.keys(byCat).forEach(k=>{if(!inPlan(k))rest.push.apply(rest,byCat[k])});
  if(rest.length){
    rest.sort((a,b)=>String(a.n).localeCompare(String(b.n)));
    parts.push(acCatSec("@other",1,null,rest,acCatRows(rest,1),""));
  }
  const reqBtn=EDIT?'<div style="margin-top:14px"><button class="btn" onclick="acReqModal(\''+esc(AC_PLAN_MJ)+'\')">调整学分要求</button></div>':'';
  box.innerHTML=parts.join("")+reqBtn;
}

function bindAcDrop(kind){
  const z=document.getElementById("ac-drop");if(!z)return;
  const over=e=>{e.preventDefault();z.classList.add("on")};
  const out=e=>{e.preventDefault();z.classList.remove("on")};
  z.addEventListener("dragover",over);z.addEventListener("dragenter",over);z.addEventListener("dragleave",out);
  z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("on");
    const fs=[].slice.call(e.dataTransfer.files||[]);if(!fs.length)return;
    const ok=fs.filter(f=>/\.xlsx$/i.test(f.name));
    if(!ok.length){showToast("请拖入 .xlsx 文件",true);return}
    doAcademicImport({files:ok,value:""},kind);
  });
}
async function doAcademicImport(inp,kind){

  try{
    const b64=toBase64(await f.arrayBuffer());
    const r=await fetch("/api/academic/"+kind,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:f.name,data:b64})});

    if(log)log.innerHTML='<div class="cards" style="margin:12px 0 4px;grid-template-columns:repeat('+(isPlan?3:2)+',minmax(0,1fr))">'+cards+'</div>'+

  }catch(err){

      '<div class="small" style="color:var(--sub)">培养方案文件名需含「xx主修培养方案」；成绩文件需包含 学号/课程名/课程号/学年学期/总成绩/学分 等列。</div>';
  }
}

async function acReqSave(major){

function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
async function genThumbs(){
  if(!EDIT){alert("请用「启动编辑模式.bat」打开后再生成缩略图");return}
  const plan=await (await fetch("/api/thumbs/plan")).json();
  const list=plan.missing||[];
  if(!list.length){alert("缩略图已齐全，无需生成");return}
  let ok=0,fail=0;
  for(let k=0;k<list.length;k++){
    const sid=list[k];
    $("#grad-cat-hint").textContent="正在生成照片缩略图 "+(k+1)+" / "+list.length+" …请勿关闭页面";
    try{
      const img=await loadImg("/photo/"+encodeURIComponent(sid));
      const max=460,sc=Math.min(1,max/Math.max(img.width,img.height));
      const c=document.createElement("canvas");
      c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      const data=c.toDataURL("image/jpeg",0.82);
      const r=await (await fetch("/api/thumb",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid,data})})).json();
      r.ok?ok++:fail++;
      img.src="";
    }catch(e){fail++}
  }
  alert("缩略图生成完成：成功 "+ok+" 张，失败 "+fail+" 张。页面将刷新。");
  try{await fetch("/api/rebuild",{method:"POST"})}catch(e){}
  location.reload();
}

function openTalk(sid,id){
  if(!EDIT){alert("当前为只读模式：请用编辑模式（双击 exe 或「启动编辑模式.bat」）打开后再记录谈话");return}
  const rec=id?TK.find(r=>r["记录ID"]===String(id)):null;
  const pad=n=>String(n).padStart(2,"0"),d=new Date();
  const nowStr=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());
  let t=rec&&rec["谈话时间"]?String(rec["谈话时间"]).replace(" ","T").slice(0,16):nowStr;
  if(/^\d{4}-\d{2}-\d{2}$/.test(t))t+="T00:00";
  const way=rec&&rec["谈话方式"]?rec["谈话方式"]:"面谈";
  const stu=S.find(s=>s["学号"]===sid)||{};
  $("#talk-form").innerHTML=
    '<div class="row"><b>'+(rec?"修改谈话记录":"新增谈话记录")+'</b><span class="small">学生：'+esc(stu["姓名"]||"")+'（'+esc(sid)+'）</span></div>'+
    '<div class="row"><span class="small">谈话时间</span><input type="datetime-local" id="talk-time" value="'+esc(t)+'">'+
      '<span class="small">方式</span><select id="talk-way">'+TALK_WAYS.map(w=>'<option'+(w===way?" selected":"")+'>'+w+'</option>').join("")+'</select></div>'+
    '<textarea id="talk-content" placeholder="谈话内容：学生诉求与状态、已做工作、约定事项、下一步跟进…">'+esc(rec?rec["谈话内容"]:"")+'</textarea>'+
    '<div class="acts"><button class="btn" onclick="closeTalk()">取消</button>'+
      '<button class="btn primary" onclick="saveTalk(\''+sid+'\','+(rec?"'"+esc(rec["记录ID"])+"'":"null")+')">保存记录</button></div>';
  $("#talk-form").style.display="block";
  const ta=$("#talk-content");if(ta)ta.focus();
}
function closeTalk(){const f=$("#talk-form");if(f){f.style.display="none";f.innerHTML=""}}
async function saveTalk(sid,id){
  const timeEl=$("#talk-time"),wayEl=$("#talk-way"),cEl=$("#talk-content");
  const t=(timeEl&&timeEl.value||"").replace("T"," ");
  const way=wayEl?wayEl.value:"";
  const c=(cEl&&cEl.value||"").trim();
  if(!t){alert("请选择谈话时间");return}
  if(!c){alert("请填写谈话内容");return}
  try{
    const r=await fetch("/api/talk",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid,id:id||"",time:t,way,content:c})});
    if(r.status===404)throw new Error("当前运行的是旧版服务（没有谈话保存接口）。请关闭黑色命令行窗口，重新双击「辅导员工作台.exe」后再试");
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"未知错误");
    const pad=n=>String(n).padStart(2,"0"),d=new Date();
    const upd=d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+" "+pad(d.getHours())+":"+pad(d.getMinutes());
    const stu=S.find(s=>s["学号"]===sid)||{};
    if(id){const rec=TK.find(x=>x["记录ID"]===String(id));if(rec){rec["谈话时间"]=t;rec["谈话方式"]=way;rec["谈话内容"]=c;rec["更新时间"]=upd}}
    else{TK.push({_i:TK.length,"记录ID":j.id,"学号":sid,"姓名":stu["姓名"]||"","谈话时间":t,"谈话方式":way,"谈话内容":c,"更新时间":upd})}
    stuDetail(sid);  /* 就地刷新详情卡，保留记录列表 */
    showToast("谈话记录已保存");
  }catch(err){
    showToast("保存失败："+err.message+"（请确认是从 exe 或「启动编辑模式.bat」打开，并保持黑窗口不关闭）",true);
  }
}

function editStudent(sid){
  if(!EDIT){alert("当前为只读模式：请用「启动编辑模式.bat」打开看板后再编辑");return}
  const x=S.find(s=>s["学号"]===sid);if(!x)return;
  const fld=f=>{
    /* 在校学年：默认按当前判定值（人工设定值优先，否则按学号推算）填好，改不改都行 */
    if(f==="在校学年"){
      const cur=String(x[f]||"").trim()||String((ASTU[sid]||{}).year||"");
      return '<div class="k">在校学年</div><div><select class="mv" data-f="在校学年">'+
        ["1","2","3","4","5","6"].map(o=>'<option'+(o===cur?' selected':'')+'>'+o+'</option>').join("")+
        '</select> <span class="small">第 N 学年（休学/降级后按实际年级选；保存后按该学年判定学业警示）</span></div>';
    }
    if(ENUM_SEL[f])return '<div class="k">'+esc(f)+'</div><div><select class="mv" data-f="'+esc(f)+'">'+[""].concat(ENUM_SEL[f]).map(o=>'<option'+((x[f]||"")===o?' selected':'')+'>'+esc(o||"(空)")+'</option>').join("")+'</select></div>';
    return '<div class="k">'+esc(f)+'</div><div><input class="mv" data-f="'+esc(f)+'" value="'+esc(x[f]||"")+'"></div>';
  };
  const base=["姓名","性别","专业","班级","在校学年","手机号","寝室号","籍贯","政治面貌","职务","性格","特长","毕业去向","去向确认状态"];
  /* 字段按毕业去向精简：
     考研/保研/留学 → 报考学校、报考结果（复试面试时间/材料齐全/录取通知已删）
     就业/考公考编 → 单位名称、地区、三方合同状态（岗位/签约日期/三方协议/劳动合同已删）
     自由职业 → 具体去向（其余全部删除） */
  const shx=isShengxue(x),d=x["毕业去向"];
  let dest=[];
  if(shx)dest=["升学_报考学校","升学_结果状态"];
  else if(d==="就业"||d==="考公考编")dest=["就业_单位名称","就业_地区","就业_三方合同状态"];
  else if(d==="自由职业")dest=["具体去向"];
  const wzFields=["外住_类型","外住_原因","外住_起止日期","外住_审批状态","外住_地址","外住_安全告知","外住_紧急联系人"];
  let rest=[];
  if(d!=="自由职业")rest=rest.concat(["GPA","专业排名","风险标签"]);
  if(!shx&&d!=="自由职业")rest.push("待办事项");  /* 考研/保研的待办事项已清空，不再显示 */
  if(d!=="自由职业")rest.push("下次跟进日期");
  if(hasWaizhu(x))rest=rest.concat(["材料_外住审批表","材料_安全承诺书"]);
  if(d!=="自由职业")rest.push("备注");
  const wzOn=hasWaizhu(x);
  $("#mbody").innerHTML='<span class="close" onclick="closeModal()">✕</span><h3>编辑：'+esc(x["姓名"])+'（'+esc(x["学号"])+'）</h3><div class="small" style="margin-bottom:8px">改动先暂存（标黄），页面下方会出现「保存 / 取消」；保存后写回 CSV 并重建看板。字段按「毕业去向」自动显示：考研/保研 → 报考学校、报考结果；就业/考公考编 → 单位名称、就业地区、三方合同状态；自由职业 → 具体去向。外住不是去向——用「是否外住」按钮控制外住登记字段。下拉框为固定枚举，请勿自由填写状态。</div>'+
    '<div class="kv" style="grid-template-columns:150px 1fr">'+base.map(fld).join("")+
    '<div class="k">是否外住</div><div><button class="btn" style="padding:3px 14px'+(wzOn?';background:var(--green);color:#fff':'')+'" onclick="setWzEdit(true)">是</button> <button class="btn" style="padding:3px 14px'+(wzOn?'':';background:var(--gray-bg)')+'" onclick="setWzEdit(false)">否</button> <span class="small">选「是」展开外住登记字段；不需要登记时选「否」收起（已有数据不会被删除）</span></div>'+
    '<div id="wz-edit" style="display:'+(wzOn?"contents":"none")+'">'+wzFields.map(fld).join("")+'</div>'+
    dest.map(fld).join("")+rest.map(fld).join("")+'</div>';
  const allFields=base.concat(dest,wzFields,rest);
  /* 切换去向时，被隐藏字段的暂存修改一并撤销，避免写回看不见的字段
     （值为空串的暂存保留：那是"主动清空"，如考研/保研清空待办事项） */
  const st=edits.students[x._i];
  if(st){
    Object.keys(st).forEach(f=>{if(allFields.indexOf(f)<0&&String(st[f])!=="")delete st[f]});
    if(!Object.keys(st).length)delete edits.students[x._i];
  }
  const orig={};allFields.forEach(f=>orig[f]=x[f]==null?"":String(x[f]));
  $("#mbody").querySelectorAll(".mv").forEach(el=>el.addEventListener("change",()=>{
    const f=el.dataset.f,v=el.value.trim();
    x[f]=v;
    if(v===orig[f]){
      if(edits.students[x._i]){delete edits.students[x._i][f];if(!Object.keys(edits.students[x._i]).length)delete edits.students[x._i]}
    }else{
      edits.students[x._i]=edits.students[x._i]||{};edits.students[x._i][f]=v;
    }
    refreshSaveBar();
    /* 改了「毕业去向」→ 立即按新去向重排字段（如 就业→保研），并保留滚动位置 */
    if(f==="毕业去向"){
      const sc=$("#mbody").scrollTop;
      editStudent(sid);
      $("#mbody").scrollTop=sc;
      /* 考研/保研/留学不再使用待办事项：切换时一并清空（保存后写入） */
      if(isShengxue(x)&&String(x["待办事项"]||"").trim()){
        x["待办事项"]="";
        edits.students[x._i]=edits.students[x._i]||{};
        edits.students[x._i]["待办事项"]="";
        refreshSaveBar();
      }
    }
  }));
  $("#mmask").style.display="block";
}

 {t:"谈话跟进",f:["学号","姓名","谈话时间","谈话方式","谈话内容"],sheet:2}
];
/* 谈话记录表的可选列（真实列名，记录ID/更新时间自动生成，不开放勾选） */
const XLS_TALK_COLS=["学号","姓名","谈话时间","谈话方式","谈话内容"];
/* 自动维护的列不列进可选清单 */
const XLS_SKIP_COLS=["最后更新时间"];

const XLS_COMMON_SKIP=["推免_资格","推免_排名","推免_公示状态","推免_录取学校","推免_是否放弃","推免_材料状态","就业_岗位","就业_签约日期","升学_复试面试时间","升学_材料齐全"];
function filteredRows(){

function xlsTalkFields(){const r=[];$$("#mbody .xp-t").forEach(c=>{if(c.checked)r.push(c.value)});return r}
function xlsGridHtml(){
  /* 可选字段 = 学生主表里真实存在的列（+谈话记录表真实列），保证「勾选项 ↔ 实际列」一一对应；
     EXCEL_GROUPS 只负责分组与顺序，分组里多出来的无效字段会被过滤掉，
     主表里没归组的真实字段补到「其他（原有字段）」里，既不漏也不假。 */
  let cols=(S[0]?Object.keys(S[0]):[]).filter(k=>k&&k!=="__row"&&XLS_SKIP_COLS.indexOf(k)<0);
  if(!cols.length)cols=[].concat.apply([],EXCEL_GROUPS.filter(g=>!g.sheet).map(g=>g.f));
  const usedS={},usedT={};
  const groups=EXCEL_GROUPS.map(g=>{
    const pool=g.sheet?XLS_TALK_COLS:cols,used=g.sheet?usedT:usedS,keep=[];
    (g.f||[]).forEach(f=>{if(pool.indexOf(f)>=0&&!used[f]){used[f]=1;keep.push(f)}});
    return {t:g.t,f:keep,sheet:g.sheet,lock:g.lock};
  }).filter(g=>g.f.length);
  const rest=cols.filter(c=>!usedS[c]);
  if(rest.length)groups.push({t:"其他（原有字段）",f:rest});
  const html=groups.map(g=>{
    const cls=g.sheet?"xp-t":"xp-f";
    return '<div class="xls-g"><div class="gt">'+g.t+(g.sheet?'（sheet'+g.sheet+'）':'')+
      (g.sheet?'<span class="gt-sub">取消勾选则不含此工作表</span>':'')+'</div>'+
      g.f.map(f=>{const lock=(g.lock||[]).indexOf(f)>=0;
        return '<label><input type="checkbox" class="'+cls+'" value="'+esc(f)+'" checked'+(lock?' disabled':'')+'>'+esc(f)+'</label>'}).join("")+'</div>';
  }).join("");
  return '<div class="xls-sec"><b>选择列</b><span class="small">（学号、姓名固定包含，用于匹配学生）</span>'+
    '<span class="sp"><button class="btn" onclick="xlsSetAll(true,false)">全选</button><button class="btn" onclick="xlsSetAll(true,true)">常用</button><button class="btn" onclick="xlsSetAll(false,false)">清空</button></span></div>'+
    '<div class="xls-grid">'+html+'</div>';
}

/* ---------- 文件保存：应用窗口里 WebView2 默认拦截浏览器下载，改由本地服务落盘 ---------- */
function nativeSaveReady(){
  return !!(window.pywebview&&window.pywebview.api&&window.pywebview.api.save_bytes);
}
function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>{const s=String(r.result||"");res(s.slice(s.indexOf(",")+1))};
    r.onerror=rej;
    r.readAsDataURL(blob);
  });
}
async function saveBlobFile(blob,name){
  if(nativeSaveReady()){
    try{
      const b64=await blobToBase64(blob);
      const r=await window.pywebview.api.save_bytes(name,b64);
      if(r&&r.ok)return {ok:true,name:r.name,dir:r.dir,path:r.path};
      if(r&&r.msg)return {ok:false,msg:r.msg};
    }catch(e){/* 退回浏览器下载 */}
  }
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>{try{URL.revokeObjectURL(url)}catch(e){}},4000);
  return {ok:true,name:name,dir:""};
}
function saveToast(prefix,res){
  if(!res.ok){showToast(res.msg||"保存失败",true);return}
  showToast(prefix+res.name+(res.dir?"，已存到 "+res.dir:""));
}

async function downloadXlsx(btn,blank){
  const fields=xlsFields();
  if(!fields.length){showToast("请至少选择一个字段",true);return}
  const talkF=xlsTalkFields();
  const payload={fields:fields,blank:!!blank,withTalks:talkF.length>0,talkFields:talkF};
  if(!blank){
    payload.masked=$("#xp-mask").checked;
    payload.keepSid=$("#xp-sid").checked;
    const scope=(document.querySelector('input[name="xp-scope"]:checked')||{}).value||"all";
    if(scope==="filtered")payload.sids=filteredRows().map(x=>x["学号"]);
  }
  const old=btn.textContent;btn.disabled=true;btn.textContent="生成中…";
  try{
    const r=await fetch("/api/excel/export",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!r.ok){let msg="生成失败";try{msg=(await r.json()).error||msg}catch(e){}
      if(msg==="not found")msg="当前运行的是旧版编辑服务，请关闭黑窗口后重新双击「启动编辑模式.bat」";
      showToast(msg,true);return}
    const blob=await r.blob();
    let fn="学生信息填报表.xlsx";
    const cd=r.headers.get("Content-Disposition")||"",m=/filename\*=UTF-8''([^;]+)/.exec(cd);
    if(m)fn=decodeURIComponent(m[1]);
    const res=await saveBlobFile(blob,fn);
    if(!res.ok){showToast(res.msg||"保存失败",true);return}
    saveToast((blank?"已下载空白模板 ":"已导出 ")+"（"+fields.length+" 列）· ",res);
  }catch(err){showToast("生成失败（未连接本地服务？请用编辑模式打开）",true)}
  finally{btn.disabled=false;btn.textContent=old}
}
