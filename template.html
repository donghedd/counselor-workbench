/* ---------- ④ 导入照片：纯学号 / 学号-姓名 / 姓名-学号 都支持 ---------- */
function nameOfSid(sid){const x=S.find(s=>String(s["学号"])===String(sid));return x?x["姓名"]:""}
/* 全角数字、全角括号、各种横线统一成半角，便于后面统一拆分 */
function normFnName(s){
  return String(s||"").replace(/[０-９]/g,d=>String.fromCharCode(d.charCodeAt(0)-0xFEE0))
    .replace(/（/g,"(").replace(/）/g,")").replace(/[－—–﹣]/g,"-")
    .replace(/＿/g,"_").replace(/．/g,".").replace(/\u3000/g," ").trim();
}
/* 文件名里的修饰词，不当姓名用 */
const PHOTO_SUFFIX=/^(证件照|照片|相片|头像|近照|正面照|免冠照|标准照|电子照|蓝底|白底|红底|一寸|二寸|小一寸|小二寸|大一寸|copy|副本|new|img|image|photo|pic|zp|sfz|\d{1,2})$/i;
/* 解析文件名 → {sid, name, how, warn} 或 {err} */
function parsePhotoName(fn){
  const base=normFnName(fn).replace(/\.[^.\\/]*$/,"");
  const digits=(base.match(/\d{9,}/g)||[]).slice().sort((a,b)=>b.length-a.length);
  let sid="",sidRaw=digits[0]||"";
  for(const d of digits){if(S.some(x=>String(x["学号"])===d)){sid=d;break}}
  const rest=base.replace(/\d+/g," ").replace(/[_\-.()\[\]{}·,、;:+#@=~'"\s]+/g," ").trim();
  let nameTok="";
  (rest?rest.split(/\s+/):[]).forEach(t=>{
    if(!t||PHOTO_SUFFIX.test(t))return;
    if(!/[\u4e00-\u9fa5]/.test(t))return;
    if(t.length>nameTok.length)nameTok=t;
  });
  let hit=sid?S.find(x=>String(x["学号"])===sid):null;
  if(!hit&&nameTok){
    hit=S.find(x=>String(x["姓名"]).replace(/\s/g,"")===nameTok)||
        S.find(x=>nameTok.indexOf(String(x["姓名"]).replace(/\s/g,""))>=0);
  }
  if(!hit){                                   /* 少数民族姓名带「·」等分隔符时整串兜底 */
    const whole=base.replace(/[_\-\s()〔〕【】\[\]]/g,"");
    hit=S.find(x=>{const n=String(x["姓名"]).replace(/\s/g,"");return n&&whole.indexOf(n)>=0});
  }
  if(!hit)return{err:sidRaw?("学号 "+sidRaw+" 不在学生名单里"):"文件名里没有学号，也匹配不到姓名"};
  let how="姓名";
  if(sid){
    if(!nameTok)how="纯学号";
    else how=(base.indexOf(nameTok)>=0&&base.indexOf(nameTok)<base.search(/\d{9,}/))?"姓名-学号":"学号-姓名";
  }
  const rn=String(hit["姓名"]||"").replace(/\s/g,"");
  let warn="";
  if(sid&&nameTok&&rn&&rn!==nameTok&&nameTok.indexOf(rn)<0&&rn.indexOf(nameTok)<0)warn="文件名里的「"+nameTok+"」与名单上的「"+rn+"」不一致，已按学号导入";
  return {sid:String(hit["学号"]),name:rn,how:how,warn:warn};
}
function blobB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result||"").split(",")[1]||"");r.onerror=rej;r.readAsDataURL(f)})}
/* 浏览器自己解码 + 压缩（支持浏览器认得的格式） */
async function thumbLocal(f){
  let url="";
  try{
    url=URL.createObjectURL(f);
    const img=await loadImg(url);
    if(!img.width||!img.height)return "";
    const max=460,sc=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement("canvas");
    c.width=Math.max(1,Math.round(img.width*sc));c.height=Math.max(1,Math.round(img.height*sc));
    const g=c.getContext("2d");
    g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);
    g.drawImage(img,0,0,c.width,c.height);
    const data=c.toDataURL("image/jpeg",0.84);
    return data.length>1500?data:"";
  }catch(e){return ""}
  finally{if(url)URL.revokeObjectURL(url)}
}
/* 浏览器解不了的（HEIC 改名成 jpg、CMYK、超大图、TIFF/BMP 等）→ 交给本地服务用 Pillow 解 */
async function thumbServer(f,sid){
  const b64=await blobB64(f);
  const r=await (await fetch("/api/thumb_raw",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid:sid,data:b64})})).json();
  if(!r||!r.ok)throw new Error((r&&r.error)||"写入失败");
  return r.info||"";
}
async function savePhoto(f,sid){
  const d=await thumbLocal(f);
  if(d){
    const r=await (await fetch("/api/thumb",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid:sid,data:d})})).json();
    if(r&&r.ok)return "browser";
  }
  await thumbServer(f,sid);
  return "server";
}
async function importPhotos(inp){
  const files=[].slice.call(inp.files||[]);inp.value="";
  if(!files.length)return;
  $("#img-log").innerHTML='<div class="small" id="img-prog" style="margin-top:12px"></div><div id="img-res"></div>';
  const ok=[],warn=[],fail=[];
  for(let k=0;k<files.length;k++){
    const f=files[k];
    const p=$("#img-prog");if(p)p.textContent="正在处理 "+(k+1)+" / "+files.length+"："+f.name;
    const m=parsePhotoName(f.name);
    if(m.err){fail.push(f.name+"："+m.err);continue}
    try{
      const via=await savePhoto(f,m.sid);
      THUMBS.add(m.sid);
      const tag=(m.name||nameOfSid(m.sid)||"")+" "+m.sid+"  ·  "+(via==="server"?"格式兜底解码":"直接导入")+"（"+m.how+"）";
      if(m.warn)warn.push(f.name+"："+tag+"<br>"+m.warn);else ok.push(tag);
    }catch(e){
      const msg=(e&&e.message)?e.message:"图片无法读取";
      fail.push(f.name+"："+msg);
    }
  }
  const li=(a,color)=>a.length?'<ul class="small" style="margin:4px 0 0 18px;line-height:1.8'+(color||"")+'">'+a.map(x=>'<li>'+esc(x).replace(/&lt;br&gt;/g,"<br>")+'</li>').join("")+'</ul>':"";
  $("#img-prog")&&$("#img-prog").remove();
  const cards=[['card g',ok.length,'导入成功'],['card y',warn.length,'已导入（需注意）'],['card r',fail.length,'未导入']]
    .filter(c=>c[0]==="card g"||c[1]>0);
  $("#img-res").innerHTML='<div class="cards" style="margin:12px 0 4px;grid-template-columns:repeat('+cards.length+',minmax(0,1fr))">'+
      cards.map(c=>'<div class="'+c[0]+'"><div class="num">'+c[1]+'</div><div class="lbl">'+c[2]+'</div></div>').join("")+'</div>'+
    (ok.length?'<div class="small" style="margin-top:6px"><b>已导入</b>'+li(ok)+'</div>':'')+
    (warn.length?'<div class="small" style="margin-top:8px"><b style="color:var(--amber,#b26a00)">需注意</b>'+li(warn,"")+'</div>':'')+
    (fail.length?'<div class="small" style="margin-top:8px;color:var(--red)"><b>未导入</b>'+li(fail)+'</div>':'')+
    (fail.length?'<div class="small" style="margin-top:6px;color:var(--sub)">文件名请用「纯学号」「学号-姓名」「姓名-学号」三种方式之一，如 20xxxxxxxxxx.jpg / 20xxxxxxxxxx-姓名.jpg / 姓名-20xxxxxxxxxx.jpg。<br>若提示格式不支持：苹果 HEIC 原图或图片损坏，请先另存为 JPG 再导入。</div>':'')+
    '<div class="small" style="margin-top:10px;color:var(--sub)">照片已压缩为 460px 缩略图存入 photos/，原图不会复制或改动。切换到「照片」视图即可查看。</div>';
  if(ok.length||warn.length){
    showToast("已导入 "+(ok.length+warn.length)+" 张照片");
    syncViewSegs();
    if(gview==="photo")renderCat();
    try{await fetch("/api/rebuild",{method:"POST"})}catch(e){}
  }
}

function bindDrop(zoneId,inputId,handler){
  const z=document.getElementById(zoneId);if(!z)return;
  const over=e=>{e.preventDefault();z.classList.add("on")};
  const out=e=>{e.preventDefault();z.classList.remove("on")};
  z.addEventListener("dragover",over);
  z.addEventListener("dragenter",over);
  z.addEventListener("dragleave",out);
  z.addEventListener("drop",e=>{
    e.preventDefault();z.classList.remove("on");
    const fs=[].slice.call(e.dataTransfer.files||[]);
    if(!fs.length)return;
    if(inputId==="img-file"){
      const imgs=fs.filter(f=>/^image\//.test(f.type||"")||/\.(jpe?g|png|webp|bmp|gif|tiff?|heic|heif|avif)$/i.test(f.name));
      if(!imgs.length){showToast("请拖入图片文件",true);return}
      importPhotos({files:imgs,value:""});
    }else{
      const ok=fs.filter(f=>/\.(xlsx|xlsm|csv)$/i.test(f.name));
      if(!ok.length){showToast("请拖入 .xlsx / .xlsm / .csv 文件",true);return}
      doImportFiles([ok[0]]);
    }
  });
}

  if(!EDIT){alert("请用「启动编辑模式.bat」打开后再删除学生");return}
  if(!await uiConfirm({title:"删除学生 "+name+"？",danger:true,ok:"删除该生",
    body:"将从学生主表中移除 <b>"+esc(name)+"（"+esc(sid)+"）</b>，其谈话记录一并删除。\n\n· 原表会自动备份到「备份」目录\n· 此操作不可撤销"}))return;
  try{
    const r=await fetch("/api/student/delete",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({sid:sid})});
    const j=await r.json();
    if(!j.ok){showToast("删除失败："+(j.error||"未知错误"),true);return}
    closeModal();showToast("已删除 "+name+"，看板已重建");
    setTimeout(()=>location.reload(),700);
  }catch(e){showToast("删除失败（未连接本地服务？请用编辑模式打开）",true)}
}
/* ================= 版本更新 ================= */
const APP_VER=DATA.version||"";
if($("#app-ver"))$("#app-ver").textContent="v"+(APP_VER||"—");
let UPD=null;
/* 启动时自动更新开关（默认开）。真正干活的是启动页 boot.html：它先查一次更新，
   有新版就静默装完自动重启；这里的开关只是把设置写进 data/settings.json。 */
let AUTO_UPD=true;
async function loadUpdCfg(){
  try{
    const r=await fetch("/api/update/config");
    const j=await r.json();
    if(typeof j.autoUpdate==="boolean")AUTO_UPD=j.autoUpdate;
  }catch(e){}
  const c=$("#auto-upd");if(c)c.checked=AUTO_UPD;
}
async function toggleAutoUpdate(el){
  const on=!!(el&&el.checked);
  try{
    const r=await fetch("/api/update/settings",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({autoUpdate:on})});
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||"保存失败");
    AUTO_UPD=!!j.autoUpdate;
    showToast(AUTO_UPD?"已开启：下次打开软件时自动更新":"已关闭：打开软件时不再自动更新");
  }catch(e){
    if(el)el.checked=!on;
    showToast("设置保存失败："+(e.message||"未连接本地服务"),true);
  }
}
loadUpdCfg();
function hideUpdBanner(){const b=$("#upd-bar");if(b){b.style.display="none";b.innerHTML=""}}
function openRelease(){
  const u=(UPD&&UPD.page)||"";
  if(!u){showToast("该版本没有提供下载页",true);return}
  window.open(u,"_blank");
}
async function checkUpdate(manual){
  if(!EDIT){if(manual)showToast("请用编辑模式（双击 exe）打开后再检查更新",true);return}
  const lk=$("#upd-link");if(lk&&manual)lk.textContent="检查中…";
  try{
    const r=await fetch("/api/update/check"+(manual?"?force=1":""));
    const j=await r.json();
    if(lk)lk.textContent="检查更新";
    if(!j.ok){
      if(j.code==="no_repo"){if(manual)repoModal();return}
      if(manual)showToast(j.error||"检查更新失败",true);
      return;
    }
    UPD=j;
    if(j.hasUpdate)showUpdBanner(j);
    else{hideUpdBanner();if(manual)showToast("已是最新版本 v"+j.current)}
  }catch(e){
    if(lk)lk.textContent="检查更新";
    if(manual)showToast("检查更新失败：未连接本地服务",true);
  }
}
function showUpdBanner(j){
  const bar=$("#upd-bar");if(!bar)return;
  const notes=String(j.notes||"").split("\n").map(s=>s.trim()).filter(Boolean)[0]||"";
  bar.innerHTML='<span>发现新版本 <b>v'+esc(j.latest)+'</b></span>'+
    '<span class="small" style="color:#5b6b86">当前 v'+esc(j.current)+'</span>'+
    (notes?'<span class="upd-notes" title="'+esc(j.notes)+'">'+esc(notes)+'</span>':'')+
    '<span class="sp"><button class="btn primary" onclick="doUpdate()">立即更新</button>'+
    '<button class="btn" onclick="openRelease()">更新说明</button>'+
    '<button class="btn" onclick="hideUpdBanner()">稍后</button></span>';
  bar.style.display="flex";
}
async function doUpdate(){
  if(!UPD||!UPD.asset){openRelease();return}
  if(!await uiConfirm({title:"更新到 v"+UPD.latest+"？",ok:"立即更新",
    body:"将下载安装包并覆盖安装。\n\n· 本程序会自动关闭，装完自动重启到新版本\n· data / photos_src / 备份 目录不会被覆盖，学生数据保留"}))return;
  const bar=$("#upd-bar");
  bar.innerHTML='<span>正在下载 <b>v'+esc(UPD.latest)+'</b>…</span><span class="small" id="upd-pct">0%</span>'+
    '<span class="sp"><span class="small" style="color:#5b6b86">下载期间请勿关闭窗口</span></span>';
  try{
    const r=await fetch("/api/update/install",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({url:UPD.asset.url,name:UPD.asset.name||"setup.exe",version:UPD.latest})});
    const j=await r.json();
    if(!j.ok){showToast("启动更新失败："+(j.error||""),true);return}
  }catch(e){showToast("启动更新失败：未连接本地服务",true);return}
  const t=setInterval(async()=>{
    try{
      const r=await fetch("/api/update/progress");const j=await r.json();
      const p=$("#upd-pct");if(p)p.textContent=(j.pct||0)+"%";
      if(j.state==="error"){
        clearInterval(t);showToast("更新失败："+(j.err||""),true);
        setTimeout(()=>location.reload(),1500);
      }else if(j.state==="done"){
        clearInterval(t);
        bar.innerHTML='<span>安装程序已启动，本窗口即将自动关闭…</span>';
      }
    }catch(e){clearInterval(t)}
  },600);
}
function repoModal(){
  const cur=(UPD&&UPD.repo)||"";
  $("#mbody").innerHTML='<span class="close" onclick="closeModal()">✕</span><h3>设置更新源</h3>'+
    '<div class="small" style="margin:-2px 0 12px">填 GitHub 仓库（用户名/仓库名）。只填一次，之后「检查更新」会自动比对版本。</div>'+
    '<div class="kv-form" style="grid-template-columns:1fr">'+
      '<label>GitHub 仓库<input id="repo-in" placeholder="zhangsan/counselor-workbench" value="'+esc(cur)+'"></label>'+
      '<label>访问令牌（仅私有仓库需要，可留空）<input id="repo-tk" placeholder="ghp_…"></label></div>'+
    '<div class="xls-row" style="margin-top:14px"><button class="btn primary" onclick="saveRepo()">保存并检查</button>'+
    '<button class="btn" onclick="closeModal()">取消</button></div>';
  $("#mmask").style.display="block";
}
async function saveRepo(){
  const repo=(($("#repo-in")||{}).value||"").trim(),tk=(($("#repo-tk")||{}).value||"").trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)){showToast("格式应为 用户名/仓库名",true);return}
  try{
    const r=await fetch("/api/update/settings",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({repo:repo,token:tk})});
    const j=await r.json();
    if(!j.ok){showToast("保存失败："+(j.error||""),true);return}
    closeModal();showToast("已保存更新源，正在检查…");
    setTimeout(()=>checkUpdate(true),250);
  }catch(e){showToast("保存失败：未连接本地服务",true)}
}

/* ================= 培养方案删除 ================= */
async function acPlanDel(){
  const m=AC_PLAN_MJ;if(!m)return;
  const n=Object.keys(ASTU).filter(sid=>ASTU[sid].major===m).length;
  if(!await uiConfirm({title:"删除「"+m+"」的培养方案？",danger:true,ok:"删除方案",
    body:"· 该专业 "+n+" 名学生的学分缺口、未获科目分析会随之清空\n· 成绩文件不受影响，重新导入方案后可恢复\n\n此操作不可撤销。"}))return;
  try{
    const r=await fetch("/api/academic/plan/delete",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({major:m})});
    const j=await r.json();
    if(!j.ok){showToast("删除失败："+(j.error||"未知错误"),true);return}
    showToast("已删除「"+j.major+"」的培养方案，正在刷新…");
    setTimeout(()=>location.reload(),900);
  }catch(e){showToast("删除失败：未连接本地服务",true)}
}

/* ================= 警示学生成绩跟进 ================= */
const FOLLOW_WAYS=["补考","重修","免修","成绩认定","其他"];
function acFollowModal(sid){
  if(!needEdit())return;
  const p=ASTU[sid]||{};
  const stu=S.find(x=>x["学号"]===sid)||{};
  const fails=(p.failed||[]).filter(f=>!f.flex);
  const done=(p.fix||[]);
  const by={};done.forEach(r=>{by[r["课程号"]]=r});
  const opts=FOLLOW_WAYS.map(w=>'<option>'+w+'</option>').join("");
  const head='<tr><th style="min-width:170px">课程</th><th>挂科学期</th><th>原成绩</th><th>跟进方式</th><th>新成绩</th><th>备注</th><th></th></tr>';
  const rows=fails.map(f=>{
    const d=by[f.code];
    if(d)return '<tr class="fp-done"><td class="nm">'+esc(f.n)+'</td><td class="small">'+esc(f.t||"")+'</td><td>'+esc(f.s)+'</td>'+
      '<td colspan="3" class="small">已登记：'+esc(d["跟进方式"]||"")+' '+esc(d["新成绩"]||"")+' 分'+(d["备注"]?"｜"+esc(d["备注"]):"")+'</td>'+
      '<td><button class="btn danger" onclick="delFollow(\''+sid+'\',\''+f.code+'\')">撤销</button></td></tr>';
    return '<tr><td class="nm">'+esc(f.n)+'<div class="small" style="color:var(--sub)">'+esc(f.code)+'</div></td>'+
      '<td class="small">'+esc(f.t||"")+'</td><td>'+esc(f.s)+'</td>'+
      '<td><select class="wy" id="fp-way-'+f.code+'">'+opts+'</select></td>'+
      '<td><input class="sc" type="text" id="fp-score-'+f.code+'" placeholder="如 72"></td>'+
      '<td><input type="text" id="fp-note-'+f.code+'" placeholder="选填" style="width:118px"></td>'+
      '<td><button class="btn primary" onclick="saveFollow(\''+sid+'\',\''+f.code+'\')">保存</button></td></tr>';
  }).join("");
  const extra=done.filter(d=>!fails.some(f=>f.code===d["课程号"]));
  const extraHtml=extra.length?'<h3 style="font-size:13.5px;margin:16px 0 6px">已跟进的课程</h3>'+
    '<table class="fp-tbl">'+head+extra.map(d=>'<tr class="fp-done"><td class="nm">'+esc(d["课程名"]||d["课程号"])+'</td>'+
      '<td class="small">—</td><td>—</td><td colspan="3" class="small">'+esc(d["跟进方式"]||"")+' '+esc(d["新成绩"]||"")+' 分'+
      (d["备注"]?"｜"+esc(d["备注"]):"")+'（'+esc(d["更新时间"]||"")+'）</td>'+
      '<td><button class="btn danger" onclick="delFollow(\''+sid+'\',\''+d["课程号"]+'\')">撤销</button></td></tr>').join("")+'</table>':'';
  const body=fails.length?'<table class="fp-tbl">'+head+rows+'</table>':
    '<div class="empty">该生当前没有挂科课程。若需修改「应修未修 / 课组缺口」，请调整培养方案或导入最新成绩。</div>';
  $("#mbody").innerHTML='<span class="close" onclick="closeModal()">✕</span><h3>成绩跟进 · '+esc(p.name||stu["姓名"]||sid)+'</h3>'+
    '<div class="small" style="margin:-2px 0 12px">学号 '+esc(sid)+' ｜ 班级 '+esc(p.class||stu["班级"]||"—")+
    ' ｜ 累计学分 '+(p.earned!==undefined?p.earned:"—")+
    ' ｜ 警示 '+(p.warn&&p.warn.type?esc(p.warn.type):"无")+
    '<br>登记补考/重修结果后，系统把该课视为已通过，学分与挂科自动重算；原始成绩文件不会被改动，可随时撤销。</div>'+
    body+extraHtml+
    '<div class="xls-row" style="margin-top:16px"><button class="btn" onclick="closeModal()">关闭</button></div>';
  $("#mmask").style.display="block";$("#mbody").scrollTop=0;
}
async function saveFollow(sid,code){
  const p=ASTU[sid]||{};
  const f=(p.failed||[]).find(x=>x.code===code)||{};
  const sc=(($("#fp-score-"+code)||{}).value||"").trim();
  const way=(($("#fp-way-"+code)||{}).value||"补考").trim();
  const note=(($("#fp-note-"+code)||{}).value||"").trim();
  if(sc&&!/^\d+(\.\d+)?$/.test(sc)){showToast("新成绩填数字，或留空按 60 计",true);return}
  try{
    const r=await fetch("/api/academic/follow",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sid:sid,code:code,name:f.n||"",way:way,score:sc,note:note,pass:"是"})});
    const j=await r.json();
    if(!j.ok){showToast("保存失败："+(j.error||"未知错误"),true);return}
    const st=j.student||{};
    showToast("已登记 "+way+"结果"+(st.warn?"，该生仍为"+st.warn:"，已解除警示")+"，正在刷新…");
    setTimeout(()=>location.reload(),900);
  }catch(e){showToast("保存失败：未连接本地服务",true)}
}
async function delFollow(sid,code){
  if(!await uiConfirm({title:"撤销这条跟进记录？",danger:true,ok:"撤销",
    body:"撤销后该课程将恢复为「挂科」状态，学分缺口重新计入。"}))return;
  try{
    const r=await fetch("/api/academic/follow",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({sid:sid,code:code,action:"delete"})});
    const j=await r.json();
    if(!j.ok){showToast("撤销失败："+(j.error||"未知错误"),true);return}
    showToast("已撤销，正在刷新…");
    setTimeout(()=>location.reload(),900);
  }catch(e){showToast("撤销失败：未连接本地服务",true)}
}

if(EDIT)setTimeout(()=>checkUpdate(false),2500);
